<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f3efe6">
<title>Kluczyk — Tesle od Marty, Wrocław</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231d1b18'/><circle cx='16' cy='10' r='5' fill='none' stroke='%23ffd23f' stroke-width='3'/><path d='M16 15v12m0-4h4m-4-4h3' stroke='%23ffd23f' stroke-width='3' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;0,9..144,900;1,9..144,500;1,9..144,700&family=Caveat:wght@500;700&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===== DEMO BAR (mock only) ===== -->
<div class="demo-bar">
  <div class="wrap demo-bar__in">
    <span class="demo-bar__badge">Mock v4</span>
    <span class="demo-bar__note">Płatności są symulowane — nic nie zostanie obciążone</span>
    <button type="button" class="demo-bar__btn" id="testDataBtn" aria-expanded="false" aria-controls="testData">Dane testowe</button>
  </div>
  <div class="test-data" id="testData" hidden></div>
</div>

<!-- ===== HEADER ===== -->
<header class="site-header">
  <div class="wrap site-header__in">
    <a class="logo" href="#/" aria-label="Kluczyk — strona główna">
      <svg class="logo__key" viewBox="0 0 20 52" aria-hidden="true"><circle cx="10" cy="9" r="6.5" fill="none" stroke="currentColor" stroke-width="3.2"/><path d="M10 15.5V48m0-7h5m-5-7h4" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg>
      <span class="logo__word">kluczyk</span>
    </a>
    <nav class="nav" aria-label="Główna">
      <a href="#/" data-scroll="tablica">Tablica</a>
      <a href="#/" data-scroll="cennik">Cennik</a>
      <a href="#/" data-scroll="kontakt">Kontakt</a>
      <a href="#/rezerwacje" data-nav="rezerwacje">Moje rezerwacje <span class="nav__count" id="bookingCount" hidden></span></a>
    </nav>
    <a class="phone-link" href="tel:+48500000000">500 000 000</a>
    <button type="button" class="switch" id="themeBtn" aria-pressed="false" title="Światło w garażu (tryb nocny)">
      <span class="switch__plate"><span class="switch__lever"></span></span>
      <span class="sr-only">Tryb nocny</span>
    </button>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<!-- ===== FOOTER ===== -->
<footer class="site-footer">
  <div class="wrap site-footer__in">
    <p class="logo__word">kluczyk</p>
    <p>Marta Lis · ul. Kluczykowa 3, Wrocław-Krzyki · +48 500 000 000 · codziennie 8:00–20:00<br>
      <span class="muted">Osoba, adres i ceny są fikcyjne — to mock, niezwiązany z Teslą.</span></p>
  </div>
  <p class="wrap site-footer__credits" id="credits"></p>
</footer>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="notify" id="notify" aria-live="assertive"></div>
<div id="modalRoot"></div>

<script src="data.js"></script>
<script src="car.js"></script>
<script src="ui.js"></script>
<script src="pay.js"></script>
<script src="app.js"></script>
</body>
</html>
