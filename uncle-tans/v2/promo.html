<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2b5712">
<title>Uncle Tan's – jak zamówić online</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&family=Paytone+One&display=swap" rel="stylesheet">
<style>
/* Promo animation: the whole order flow played on a phone (customer) and a tablet (restaurant panel).
   The stage has a fixed size – 1600×900 (16:9) or 1080×1920 (9:16, stories / reels) – and is scaled to the window,
   so a screen recording looks the same everywhere. Screens are simplified copies of index / order / p24 / panel. */
:root{
  /* stage – the logo's green band, red "UNCLE TAN'S" and yellow "ASIAN" */
  --g:#2b5712; --g-d:#1d3d0b; --g-l:#3d7a1c; --y:#ffcc2e; --r:#c4150c; --cream:#fff6df;
  /* app (styles.css) */
  --accent:#e8671c; --accent-d:#c4520f; --accent-soft:#fff1e6; --green:#2f7d32; --green-soft:#e8f5e9; --red:#c62828; --red-soft:#fdecea;
  --blue:#1d5fbf; --blue-soft:#e8f0fc; --amber:#8a5a00; --amber-soft:#fff6e5;
  --ink:#1f1a17; --ink-2:#6a605a; --ink-3:#9a8f88; --paper:#faf6f0; --white:#fff; --line:#ece4da;
  --shadow-sm:0 1px 2px rgba(31,26,23,.05); --shadow:0 10px 30px rgba(31,26,23,.08);
  --font:'Be Vietnam Pro',system-ui,sans-serif; --display:'Paytone One','Be Vietnam Pro',system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);background:#10200a;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.nw{white-space:nowrap}
img{display:block}

/* ================= viewport + controls ================= */
.viewport{position:fixed;inset:0 0 56px 0;overflow:hidden}
body.no-ui .viewport{bottom:0}
.stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;
  background:radial-gradient(ellipse 70% 80% at 72% 50%,var(--g-l) 0%,var(--g) 55%,var(--g-d) 100%)}
.stage.is-land{width:1600px;height:900px}
.stage.is-port{width:1080px;height:1920px;background:radial-gradient(ellipse 90% 60% at 50% 62%,var(--g-l) 0%,var(--g) 55%,var(--g-d) 100%)}

.controls{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;background:#10200a;color:var(--cream)}
body.no-ui .controls{display:none}
.controls button{height:36px;min-width:36px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,246,223,.22);background:rgba(255,246,223,.08);color:var(--cream);font-size:.85rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.controls button:hover{background:rgba(255,246,223,.18)}
.controls button:focus-visible{outline:2px solid var(--y);outline-offset:2px}
.controls button[aria-pressed=true]{background:var(--y);border-color:var(--y);color:var(--g-d)}
.controls svg{width:14px;height:14px;fill:currentColor}
.controls__sep{width:1px;height:22px;background:rgba(255,246,223,.18);margin:0 4px}
.controls__hint{font-size:.75rem;color:rgba(255,246,223,.55);margin-left:6px;white-space:nowrap}
@media (max-width:640px){.controls__hint,.controls__sep{display:none}.controls{gap:6px}.controls button{padding:0 10px}}

/* ================= stage: copy ================= */
.copy{position:absolute;display:flex;flex-direction:column;color:var(--cream)}
.is-land .copy{left:72px;top:64px;bottom:64px;width:540px}
.is-port .copy{left:80px;right:80px;top:84px;height:560px}
.brandline{display:flex;align-items:center;gap:14px}
.brandline img{width:58px;height:58px;border-radius:16px;background:#fff;padding:3px;object-fit:contain;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.brandline b{display:block;font-family:var(--display);font-weight:400;font-size:23px;line-height:1.1}
.brandline i{display:block;font-weight:700;font-style:italic;font-size:15px;color:var(--y);margin-top:3px}
.is-port .brandline img{width:76px;height:76px;border-radius:20px}
.is-port .brandline b{font-size:31px}
.is-port .brandline i{font-size:19px}

.say{margin-top:auto;margin-bottom:auto;padding:24px 0}
.is-port .say{margin:48px 0 0;padding:0}
.say__eyebrow{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--y)}
.say__eyebrow svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
.say__title{font-family:var(--display);font-weight:400;font-size:58px;line-height:1.06;letter-spacing:-.01em;margin-top:16px;text-wrap:balance}
.say__title em{font-style:normal;color:var(--y)}
.say__text{font-size:22px;line-height:1.45;font-weight:500;color:rgba(255,246,223,.86);margin-top:20px;max-width:30em;text-wrap:pretty}
.say__text q{quotes:"„" "”";font-weight:700;color:var(--cream)}
:lang(en) .say__text q,:lang(vi) .say__text q{quotes:"“" "”"}
:lang(de) .say__text q{quotes:"„" "“"}
.is-port .say__eyebrow{font-size:20px}
.is-port .say__eyebrow svg{width:20px;height:20px}
.is-port .say__title{font-size:78px;margin-top:20px}
.is-port .say__text{font-size:30px;margin-top:24px}
.say.is-out .say__eyebrow,.say.is-out .say__title,.say.is-out .say__text{opacity:0;transform:translateY(14px)}
.say__eyebrow,.say__title,.say__text{transition:opacity .45s var(--ease),transform .45s var(--ease)}
.say__title{transition-delay:.06s}.say__text{transition-delay:.12s}

/* flow rail: the 8 steps; the device glyph says where the step happens */
.flow{list-style:none;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,auto);grid-auto-flow:column;gap:10px 20px;counter-reset:f}
.is-port .flow{position:absolute;left:0;right:0;top:1640px;grid-template-columns:repeat(4,1fr);grid-template-rows:auto auto;grid-auto-flow:row;gap:14px 16px}
.flow li{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:rgba(255,246,223,.5);counter-increment:f;transition:color .3s}
.is-port .flow li{font-size:21px;gap:12px}
.flow li::before{content:counter(f);flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid rgba(255,246,223,.3);display:grid;place-items:center;font-size:13px;font-weight:800;transition:.3s}
.is-port .flow li::before{width:36px;height:36px;font-size:17px}
.flow svg{flex:none;width:12px;height:16px;margin-left:auto;fill:none;stroke:currentColor;stroke-width:1.6;opacity:.7}
.flow svg.t{width:17px;height:13px}
.is-port .flow svg{display:none}
.flow li.is-done{color:rgba(255,246,223,.78)}
.flow li.is-done::before{content:'✓';background:var(--y);border-color:var(--y);color:var(--g-d)}
.flow li.is-now{color:var(--cream);font-weight:800}
.flow li.is-now::before{background:var(--cream);border-color:var(--cream);color:var(--g-d);box-shadow:0 0 0 5px rgba(255,246,223,.18)}

/* ================= stage: devices ================= */
.dev{position:absolute;left:0;top:0;transition:transform 1s var(--ease),opacity .7s var(--ease);will-change:transform}
.phone{width:414px;height:868px;padding:12px;border-radius:64px;background:#141414;box-shadow:0 0 0 2px #3a3a3a inset,0 40px 80px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.06)}
.tablet{width:1056px;height:752px;padding:16px;border-radius:40px;background:#141414;box-shadow:0 0 0 2px #3a3a3a inset,0 40px 90px rgba(0,0,0,.45)}

/* positions per layout and scene group (transform = centre of the device, then scale) */
.is-land .phone{transform:translate(933px,16px) scale(.94)}
.is-land.m-both .phone{transform:translate(533px,226px) scale(.42)}
.is-land.m-outro .phone{transform:translate(693px,28px) scale(.8) rotate(-4deg)}
.is-land .tablet{transform:translate(1700px,24px) scale(.8);opacity:0}
.is-land.m-both .tablet{transform:translate(602px,24px) scale(.8);opacity:1}
.is-land.m-outro .tablet{transform:translate(1700px,24px) scale(.8);opacity:0}
.is-port .phone{transform:translate(333px,696px) scale(1.2)}
.is-port.m-both .phone{transform:translate(43px,1046px) scale(.5)}
.is-port.m-outro .phone{transform:translate(93px,696px) scale(.9) rotate(-4deg)}
.is-port .tablet{transform:translate(1200px,600px) scale(.97);opacity:0}
.is-port.m-both .tablet{transform:translate(12px,600px) scale(.97);opacity:1}
.is-port.m-outro .tablet{transform:translate(1200px,600px) scale(.97);opacity:0}
.phone,.tablet{transform-origin:50% 50%}

/* "live" callout next to the small phone while the restaurant works on the tablet */
.live{position:absolute;display:flex;align-items:center;gap:12px;background:var(--cream);color:var(--ink);border-radius:18px;padding:14px 20px 14px 16px;box-shadow:0 18px 40px rgba(0,0,0,.3);font-size:18px;font-weight:700;opacity:0;transform:translateY(10px);transition:opacity .4s var(--ease),transform .4s var(--ease);white-space:nowrap}
.live small{display:block;font-size:13px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.live__dot{width:14px;height:14px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(47,125,50,.5);animation:ping 1.6s ease-out infinite;flex:none}
.live.is-on{opacity:1;transform:none}
.live.is-flash{animation:flash .6s ease}
@keyframes flash{40%{transform:scale(1.06)}}
.is-land .live{left:790px;top:748px}
.is-port .live{left:430px;top:1440px;font-size:24px;padding:18px 26px 18px 20px}
.is-port .live small{font-size:16px}

/* intro: dish photos around the phone */
.sticker{position:absolute;width:150px;height:150px;border-radius:50%;border:6px solid var(--cream);overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.35);opacity:0;transform:scale(.4) rotate(-12deg);transition:opacity .5s var(--ease),transform .7s cubic-bezier(.3,1.5,.5,1)}
.sticker img{width:100%;height:100%;object-fit:cover}
.sticker.is-on{opacity:1;transform:scale(1) rotate(var(--rot,0deg))}
.sticker span{position:absolute;inset:auto 0 12px;text-align:center;font-weight:800;font-size:13px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.is-land .sticker:nth-of-type(1){left:700px;top:110px;--rot:-8deg}
.is-land .sticker:nth-of-type(2){left:1400px;top:90px;--rot:7deg}
.is-land .sticker:nth-of-type(3){left:1410px;top:600px;--rot:-5deg}
.is-land .sticker:nth-of-type(4){left:720px;top:620px;--rot:9deg}
.is-port .sticker{width:190px;height:190px}
.is-port .sticker:nth-of-type(1){left:40px;top:740px;--rot:-8deg}
.is-port .sticker:nth-of-type(2){left:850px;top:700px;--rot:7deg}
.is-port .sticker:nth-of-type(3){left:860px;top:1380px;--rot:-5deg}
.is-port .sticker:nth-of-type(4){left:30px;top:1420px;--rot:9deg}
.float{animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{translate:0 -10px}}

/* outro: QR card */
.qr{position:absolute;width:400px;background:#fff;border-radius:28px;padding:26px 26px 22px;text-align:center;color:var(--ink);box-shadow:0 30px 70px rgba(0,0,0,.4);opacity:0;transform:translateY(40px) rotate(3deg);transition:opacity .6s var(--ease),transform .8s var(--ease)}
.qr img{width:100%;aspect-ratio:1}
.qr b{display:block;font-family:var(--display);font-weight:400;font-size:27px;margin-top:10px;color:var(--g)}
.qr small{display:block;font-size:15px;color:var(--ink-2);font-weight:600;margin-top:2px}
.m-outro .qr{opacity:1;transform:rotate(3deg)}
.is-land .qr{left:1110px;top:170px}
.is-port .qr{left:560px;top:860px;width:440px}

/* the tapping finger */
.finger{position:absolute;left:0;top:0;width:0;height:0;z-index:50;opacity:0;transition:opacity .25s,transform .6s var(--ease);pointer-events:none}
.finger.is-on{opacity:1}
.finger__dot{position:absolute;left:-28px;top:-28px;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.42);border:3px solid #fff;box-shadow:0 6px 20px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.08);transition:transform .15s}
.finger.is-press .finger__dot{transform:scale(.78);background:rgba(255,204,46,.65)}
.finger__ring{position:absolute;left:-28px;top:-28px;width:56px;height:56px;border-radius:50%;border:3px solid var(--y);opacity:0}
.finger.is-press .finger__ring{animation:ring .55s ease-out}
@keyframes ring{0%{opacity:1;transform:scale(.8)}100%{opacity:0;transform:scale(2.2)}}
.finger__label{position:absolute;left:0;bottom:40px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:17px;font-weight:700;padding:8px 14px;border-radius:12px;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.finger__label::after{content:'';position:absolute;left:50%;bottom:-6px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:var(--ink)}
.finger__label:empty{display:none}
.is-port .finger__label{font-size:22px;padding:10px 18px;bottom:46px}

/* ================= phone screen (copy of the mobile layout of styles.css) ================= */
.scr{position:relative;width:390px;height:844px;border-radius:52px;overflow:hidden;background:var(--sb,var(--accent-soft));font-size:16px;line-height:1.5;color:var(--ink);transition:background .3s}
.sb{position:absolute;left:0;right:0;top:0;height:47px;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 44px;font-size:16px;font-weight:700;pointer-events:none}
.sb__island{position:absolute;left:50%;top:11px;width:122px;height:35px;margin-left:-61px;border-radius:20px;background:#000}
.sb__icons{display:flex;gap:6px;align-items:center}
.sb__icons svg{height:12px;fill:currentColor}
.home{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink);z-index:30}

.view{position:absolute;left:0;right:0;top:47px;bottom:0;overflow:hidden;background:var(--paper);transition:transform .45s var(--ease),opacity .45s var(--ease)}
.view.is-off-r{transform:translateX(100%)}
.view.is-off-l{transform:translateX(-28%);opacity:.6}
.scroller{position:relative;transition:transform .8s var(--ease)}
.pad{padding:0 16px}
.muted{color:var(--ink-2)}

/* header + facts */
.hdr{background:linear-gradient(180deg,var(--accent-soft) 0%,var(--paper) 100%);padding:14px 0 14px}
.brand{display:flex;align-items:center;gap:12px}
.brand__logo{width:52px;height:52px;border-radius:16px;background:#fff;box-shadow:var(--shadow);flex:none;display:grid;place-items:center}
.brand__logo img{width:100%;height:100%;object-fit:contain;padding:3px}
.brand__name{font-size:1.25rem;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.brand__tag{color:var(--green);font-weight:700;font-style:italic;font-size:.8rem}
.brand__meta{color:var(--ink-2);font-size:.76rem;margin-top:.15rem}
.pill{align-self:flex-start;margin-left:auto;display:flex;align-items:center;gap:.4rem;height:38px;padding:0 .65rem 0 .55rem;border-radius:999px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);font-size:.85rem;font-weight:700;flex:none}
.flag{flex:none;width:24px;height:16px;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px rgba(31,26,23,.14)}
.flag svg{display:block;width:100%;height:100%}
.chev{width:10px;height:10px;fill:none;stroke:var(--ink-2);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.facts{display:grid;grid-template-columns:repeat(3,1fr);margin-top:.9rem;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm)}
.fact{padding:.55rem .4rem;text-align:center;border-left:1px solid var(--line);line-height:1.3}
.fact:first-child{border-left:0}
.fact strong{display:block;font-size:.8rem}
.fact small{display:block;font-size:.7rem;color:var(--ink-2)}
.fact--open strong{color:var(--green)}
.fact--open strong::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-soft);margin-right:.4rem;vertical-align:1px}

/* category chips (in the page + a fixed copy once the page scrolls) */
.cats{padding:.55rem 16px;border-bottom:1px solid var(--line);background:rgba(250,246,240,.96);white-space:nowrap;overflow:hidden}
.cats__in{display:flex;gap:.4rem;transition:transform .6s var(--ease)}
.cats span{flex:none;font-size:.86rem;font-weight:600;padding:.42rem .85rem;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--ink-2);transition:.2s}
.cats span.is-active{background:var(--ink);border-color:var(--ink);color:#fff}
.cats--fixed{position:absolute;left:0;right:0;top:0;z-index:5;opacity:0;transform:translateY(-100%);transition:opacity .25s,transform .25s}
.cats--fixed.is-on{opacity:1;transform:none}

.cat{margin-top:1.1rem}
.cat__title{font-size:1.15rem;font-weight:800;display:flex;align-items:baseline;gap:.5rem;letter-spacing:-.01em}
.cat__en{font-size:.82rem;font-weight:500;color:var(--ink-3)}
.cat__desc{font-size:.86rem;color:var(--ink-2);margin-top:.2rem}
.items{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm);margin-top:.7rem}
.item{display:flex;gap:.9rem;align-items:center;padding:.85rem .9rem;border-top:1px solid var(--line);transition:box-shadow .2s}
.item:first-child{border-top:0}
.item.is-in{box-shadow:inset 3px 0 0 var(--accent)}
.item__body{flex:1;min-width:0}
.item__name{font-size:.94rem;font-weight:700;line-height:1.3}
.item__en{font-size:.8rem;color:var(--ink-3)}
.item__price{font-weight:800;margin-top:.4rem;font-size:.95rem}
.item__price span{font-weight:500;color:var(--ink-3);font-size:.8rem}
.tag{display:inline-block;font-size:.66rem;font-weight:700;padding:.08rem .42rem;border-radius:6px;margin-left:.35rem;vertical-align:2px;text-transform:uppercase;letter-spacing:.03em;background:var(--green-soft);color:var(--green)}
.item__media{position:relative;flex:none;width:92px;height:92px}
.item__media img{width:100%;height:100%;object-fit:cover;border-radius:14px;background:#fbf3ea}
.item__ctl{position:absolute;right:-6px;bottom:-6px}
.add{position:relative;width:40px;height:40px;border-radius:50%;background:#fff;color:var(--accent);display:grid;place-items:center;box-shadow:0 2px 10px rgba(31,26,23,.16);transition:background .15s,color .15s}
.add.is-hit{background:var(--accent);color:#fff}
.add__badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--ink);color:#fff;font-size:.72rem;font-weight:700;display:grid;place-items:center;border:2px solid #fff;animation:pop .35s ease}
.step{display:flex;align-items:center;background:var(--accent);color:#fff;border-radius:999px;height:40px;box-shadow:0 4px 12px rgba(232,103,28,.3);animation:grow .3s var(--ease);transform-origin:right center}
.step i{width:36px;height:40px;display:grid;place-items:center}
.step b{min-width:18px;text-align:center;font-weight:800;font-size:.95rem}
@keyframes grow{from{transform:scaleX(.35);opacity:.4}}
.ico{width:18px;height:18px;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;fill:none}
.step .ico{width:16px;height:16px}

/* bottom bar + sheets */
.cartbar{position:absolute;left:12px;right:12px;bottom:28px;z-index:8;display:flex;align-items:center;gap:.8rem;font-weight:700;background:var(--accent);color:#fff;padding:.85rem 1.1rem;border-radius:18px;box-shadow:0 10px 30px rgba(232,103,28,.4);transform:translateY(160%);transition:transform .4s var(--ease)}
.cartbar.is-on{transform:none}
.cartbar.is-bump{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.05)}}
.cartbar__n{background:#fff;color:var(--accent);border-radius:999px;min-width:26px;height:26px;padding:0 6px;display:grid;place-items:center;font-size:.85rem}
.cartbar span:nth-child(2){flex:1}
.backdrop{position:absolute;inset:0;z-index:10;background:rgba(31,26,23,.45);opacity:0;pointer-events:none;transition:opacity .3s}
.backdrop.is-on{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:11;background:#fff;border-radius:22px 22px 0 0;padding:1rem 1.1rem 2.1rem;transform:translateY(105%);transition:transform .38s var(--ease)}
.sheet.is-on{transform:none}
.handle{width:40px;height:4px;border-radius:4px;background:var(--line);margin:-.3rem auto .7rem}
.x{position:absolute;top:.8rem;right:.8rem;width:36px;height:36px;display:grid;place-items:center;color:var(--ink-2);font-size:1rem}
.vm-img{width:150px;height:150px;object-fit:cover;border-radius:20px;margin:0 auto .9rem}
.sheet h3{font-size:1.2rem;line-height:1.25}
.vm-label{font-weight:700;margin:1rem 0 .5rem;font-size:.9rem}
.opt{display:flex;align-items:center;gap:.65rem;border:1.5px solid var(--line);border-radius:14px;padding:.8rem .9rem;font-weight:600;margin-bottom:.45rem;transition:.2s}
.opt.is-on{border-color:var(--accent);background:var(--accent-soft)}
.radio{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink-3);display:grid;place-items:center;background:#fff}
.is-on>.radio{border-color:var(--accent)}
.is-on>.radio::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--accent)}
.vm-foot{display:flex;gap:.8rem;align-items:center;margin-top:1.1rem}
.qty{display:inline-flex;align-items:center;justify-self:start;border:1px solid var(--line);border-radius:999px;height:32px}
.qty i{width:32px;display:grid;place-items:center}
.qty b{min-width:20px;text-align:center;font-weight:700;font-size:.88rem}
.qty .ico{width:14px;height:14px}
.vm-foot .qty{height:46px}.vm-foot .qty i{width:40px}
.btn{display:flex;align-items:center;justify-content:center;gap:.4rem;font-weight:700;padding:.75rem 1.3rem;border-radius:999px;background:var(--accent);color:#fff;transition:background .15s,transform .15s;white-space:nowrap}
.btn.is-hit{background:var(--accent-d);transform:scale(.97)}
.btn--lg{padding:1rem 1.6rem;font-size:1.02rem}
.vm-foot .btn{flex:1}
.cart__head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem}
.cart__head h2{font-size:1.1rem}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px}
.seg span{text-align:center;font-weight:600;font-size:.88rem;padding:.55rem .4rem;border-radius:999px;color:var(--ink-2);transition:.2s}
.seg span.is-on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.line{display:grid;grid-template-columns:1fr auto;gap:.35rem .6rem;padding:.7rem 0;border-bottom:1px solid var(--line)}
.line__name{font-weight:600;font-size:.9rem;line-height:1.3}
.line__variant{font-size:.78rem;color:var(--ink-2)}
.line__price{font-weight:700;font-size:.9rem;text-align:right}
.cart__foot{border-top:1px solid var(--line);padding-top:.8rem;margin-top:.4rem}
.row{display:flex;justify-content:space-between;gap:1rem;font-size:.9rem;margin-bottom:.3rem;transition:opacity .25s}
.row--total{font-weight:800;font-size:1.1rem;margin:.5rem 0 .8rem}
.row.is-gone{opacity:0;height:0;margin:0;overflow:hidden}

/* checkout */
.co-head{position:absolute;left:0;right:0;top:0;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:.6rem .6rem .6rem 1rem;background:#fff;border-bottom:1px solid var(--line);height:57px}
.co-head h2{font-size:1.15rem}
.co{padding:73px 16px 140px;background:#fff}
.co-lead{font-size:.88rem;color:var(--ink-2);background:var(--paper);border-radius:12px;padding:.6rem .8rem}
.fs{margin-top:1.3rem}
.fs__legend{font-weight:800;font-size:.95rem;margin-bottom:.55rem}
.fld{font-size:.8rem;font-weight:600;color:var(--ink-2);margin-bottom:.65rem}
.inp{margin-top:.25rem;font-size:1rem;color:var(--ink);font-weight:500;padding:.75rem .85rem;border:1.5px solid var(--line);border-radius:12px;background:#fff;min-height:50px;transition:border-color .2s,box-shadow .2s;white-space:nowrap;overflow:hidden}
.inp:empty::before{content:attr(data-ph);color:var(--ink-3)}
.inp.is-focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp.is-focus::after{content:'';display:inline-block;width:2px;height:1.1em;background:var(--accent);vertical-align:-3px;margin-left:1px;animation:blink 1s steps(1) infinite}
.inp.is-focus:empty::before{content:''}
@keyframes blink{50%{opacity:0}}
.inp--sel{display:flex;justify-content:space-between;align-items:center}
.inp--area{min-height:64px}
.grid-pc{display:grid;grid-template-columns:118px 1fr;gap:0 .8rem}
.hint{font-size:.82rem;color:var(--ink-2);margin-top:.55rem}
.rad{display:flex;gap:.65rem;align-items:flex-start;font-size:.9rem;border:1.5px solid var(--line);border-radius:14px;padding:.8rem .9rem;margin-bottom:.5rem;transition:.2s}
.rad.is-on{border-color:var(--accent);background:var(--accent-soft)}
.rad .radio{margin-top:.15rem}
.summary{background:var(--paper);border-radius:14px;padding:1rem;margin:1.3rem 0 .6rem;font-size:.88rem}
.summary .row{font-size:.88rem}
.summary .row--total{margin:.6rem 0 0;padding-top:.6rem;border-top:1px solid var(--line);font-size:1.05rem}
.summary .row span:last-child{white-space:nowrap}
.chk{display:flex;gap:.65rem;align-items:flex-start;font-size:.9rem;margin-top:.7rem}
.box{flex:none;width:20px;height:20px;border-radius:5px;border:1.5px solid var(--ink-3);display:grid;place-items:center;margin-top:.1rem;background:#fff;transition:.15s}
.chk.is-on .box{background:var(--accent);border-color:var(--accent)}
.chk.is-on .box::after{content:'';width:10px;height:5px;border:2.4px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.u{text-decoration:underline}
.co-foot{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:.8rem 1rem 30px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff 30%)}
.co-foot .btn{background:var(--accent-d)}

/* przelewy24 */
.p24{background:#f1f1f3}
.p24__card{background:#fff;text-align:center;padding:2rem 1.4rem 2.2rem;display:grid;gap:.6rem}
.p24__brand{font-weight:800;color:#d13239;font-size:1.05rem}
.p24__card h2{font-size:2.3rem;line-height:1.1}
.p24__session{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.75rem;color:var(--ink-3)}
.p24__methods{display:flex;justify-content:center;gap:.4rem;margin:.7rem 0 1rem}
.p24__methods span{border:1.5px solid var(--line);border-radius:10px;padding:.4rem .8rem;font-weight:700;font-size:.85rem;transition:.2s}
.p24__methods span.is-on{border-color:#d13239;background:#fdecee;color:#b3242b}
.p24__safe{font-size:.78rem;color:var(--ink-3);margin-top:.4rem}

/* order page */
.o-hdr{background:linear-gradient(180deg,var(--accent-soft) 0%,var(--paper) 100%);padding:14px 16px}
.o-card{background:#fff;padding:1.4rem 1rem 1.2rem;text-align:center}
.spinner{width:56px;height:56px;border-radius:50%;border:5px solid var(--accent-soft);border-top-color:var(--accent);margin:1rem auto 1.2rem;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.o-card h2{font-size:1.35rem;line-height:1.25}
.o-card .muted{font-size:.92rem;margin-top:.3rem}
.o-no{display:inline-block;margin-top:.9rem;font-weight:700;font-size:.88rem;background:var(--paper);border-radius:10px;padding:.3rem .8rem}
.done__icon{width:72px;height:72px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;margin:.2rem auto 1rem;animation:pop .4s ease}
.done__icon svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}}
.done__no{display:inline-block;font-weight:800;font-size:1.3rem;letter-spacing:.06em;background:var(--paper);border:1.5px dashed var(--line);border-radius:12px;padding:.3rem 1rem;margin:.8rem 0 .6rem}
.track{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);margin:.5rem 0 .9rem;font-size:.74rem;font-weight:600;color:var(--ink-3)}
.track li{position:relative;padding-top:1.3rem;line-height:1.25;transition:color .3s}
.track li::before{content:'';position:absolute;top:.2rem;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--line);z-index:1;transition:background .3s}
.track li::after{content:'';position:absolute;top:calc(.2rem + 5px);left:-50%;right:50%;height:2px;background:var(--line);transition:background .3s}
.track li:first-child::after{display:none}
.track li.is-done{color:var(--green)}
.track li.is-done::before,.track li.is-done::after{background:var(--green)}
.track li.is-now{color:var(--ink);font-weight:800}
.track li.is-now::before{box-shadow:0 0 0 4px var(--green-soft)}
.track li.is-now:not(:last-child)::before{animation:ping 1.6s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(47,125,50,.45)}100%{box-shadow:0 0 0 9px rgba(47,125,50,0)}}
.done__eta{font-size:1.02rem;margin:.2rem 0 1rem}
.o-card .summary{text-align:left;margin-top:0}
.o-notes{font-size:.88rem;text-align:left;background:var(--paper);border-radius:12px;padding:.6rem .8rem}

/* ================= tablet screen (panel.css) ================= */
.tscr{position:relative;width:1024px;height:720px;border-radius:26px;overflow:hidden;background:#fff;font-size:16px;line-height:1.5;display:flex;flex-direction:column}
.ptop{flex:none;display:flex;align-items:center;gap:.75rem;height:62px;padding:0 18px;border-bottom:1px solid var(--line)}
.ptop__logo{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);overflow:hidden}
.ptop__logo img{width:100%;height:100%;object-fit:contain;padding:2px}
.ptop__name strong{display:block;font-size:1rem;line-height:1.2}
.ptop__name small{display:block;color:var(--ink-2);font-size:.78rem;font-weight:600}
.ptop__stats{margin-left:auto;font-size:.86rem;font-weight:600;color:var(--ink-2)}
.ptop__pill{display:flex;align-items:center;gap:.4rem;height:34px;padding:0 .75rem;border-radius:999px;border:1px solid var(--line);font-size:.82rem;font-weight:700;position:relative}
.ptop__pill .flag{width:21px;height:14px}
.bell{display:inline-block;transform-origin:50% 10%}
.is-ringing .bell{animation:ring-bell .5s ease-in-out 4}
@keyframes ring-bell{25%{transform:rotate(18deg)}75%{transform:rotate(-18deg)}}
.is-ringing::after{content:'';position:absolute;inset:-3px;border-radius:999px;border:2px solid var(--accent);animation:ring 1s ease-out 2}
.pmain{flex:1;min-height:0;display:grid;grid-template-columns:360px 1fr}
.plist{border-right:1px solid var(--line);padding:12px;background:#fff}
.ptabs{margin-bottom:.2rem}
.ptabs .n{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;margin-left:.35rem;border-radius:999px;background:var(--accent);color:#fff;font-size:.72rem;font-weight:800;vertical-align:1px}
.plane{display:flex;align-items:center;gap:.45rem;margin:1rem .2rem .5rem;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.plane b{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--line);color:var(--ink);display:grid;place-items:center;letter-spacing:0}
.plane--new{color:var(--accent-d)}
.plane--new b{background:var(--accent);color:#fff}
.pempty{text-align:center;color:var(--ink-2);padding:3rem 1rem;font-size:.92rem}
.porder{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:.7rem .85rem .7rem 1rem;box-shadow:var(--shadow-sm);transition:border-color .2s,box-shadow .2s}
@keyframes slidein{from{transform:translateY(-14px);opacity:0}}
.porder::before{content:'';position:absolute;left:-1.5px;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--line)}
.porder.is-new{animation:slidein .45s var(--ease),pnew 1.6s ease-in-out .45s infinite}
.porder.is-new::before{background:var(--accent)}
.porder.is-acc::before{background:var(--blue)}
.porder.is-out::before{background:var(--green)}
.porder.is-sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
@keyframes pnew{50%{background:var(--accent-soft);border-color:#f3c7a6}}
.porder__top{display:flex;align-items:center;gap:.45rem}
.porder__top strong{font-size:1rem;font-weight:800;letter-spacing:.02em}
.porder__time{margin-left:auto;font-size:.78rem;font-weight:600;color:var(--ink-2)}
.porder__mid{display:flex;justify-content:space-between;margin-top:.15rem;font-size:.88rem;color:var(--ink-2)}
.porder__mid b{color:var(--ink)}
.porder__tags{display:flex;gap:.3rem;margin-top:.45rem}
.ptag{font-size:.7rem;font-weight:700;padding:.12rem .45rem;border-radius:6px;background:var(--paper);color:var(--ink-2)}
.ptag--paid{background:var(--green-soft);color:var(--green)}
.pdetail{display:flex;flex-direction:column;min-height:0;background:#fff}
.pdetail__body{flex:1;overflow:hidden;padding:1.1rem 1.5rem}
.pdetail__empty{height:100%;display:grid;place-items:center;color:var(--ink-2);font-size:.95rem}
.phead{display:flex;align-items:center;gap:.6rem}
.phead h2{font-size:1.7rem;font-weight:800;letter-spacing:.02em;line-height:1.1}
.phead small{margin-left:auto;font-size:.82rem;color:var(--ink-2)}
.pchip{display:inline-block;font-size:.7rem;font-weight:800;padding:.18rem .55rem;border-radius:999px;text-transform:uppercase;letter-spacing:.04em;background:var(--accent);color:#fff}
.pchip--acc{background:var(--blue-soft);color:var(--blue)}
.pchip--out{background:var(--green-soft);color:var(--green)}
.pfacts{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.9rem}
.pfact{border:1.5px solid var(--line);border-radius:14px;padding:.6rem .9rem}
.pfact small{display:block;font-size:.8rem;font-weight:700;color:var(--ink-2)}
.pfact strong{display:block;font-size:1.3rem;font-weight:800;line-height:1.25}
.pfact span{display:block;font-size:.85rem;font-weight:700;color:var(--blue)}
.pfact--paid{background:var(--green-soft);border-color:transparent}
.pfact--paid small{color:var(--green)}
.paddr{margin-top:.7rem;font-weight:600}
.pnotes{margin-top:.6rem;background:#fff3c4;border-radius:12px;padding:.55rem .85rem;font-weight:700}
.pticket{margin-top:.6rem;border-top:1.5px dashed var(--line)}
.pline{display:grid;grid-template-columns:2.4rem 1fr auto;gap:.6rem;align-items:baseline;padding:.5rem 0;border-bottom:1px solid var(--line);font-size:1.05rem;font-weight:600}
.pline small{display:block;font-size:.85rem;color:var(--ink-2)}
.pline__p{font-size:.9rem;color:var(--ink-2)}
.pactions{flex:none;border-top:1px solid var(--line);padding:.8rem 1.5rem 1rem;box-shadow:0 -6px 20px rgba(31,26,23,.05)}
.pactions__label{font-size:.82rem;font-weight:700;color:var(--ink-2);margin-bottom:.45rem}
.peta{display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem;margin-bottom:.7rem}
.peta span{height:48px;border-radius:12px;border:1.5px solid var(--line);font-weight:800;display:grid;place-items:center;transition:.2s}
.peta span.is-on{background:var(--ink);border-color:var(--ink);color:#fff}
.prow{display:flex;gap:.6rem}
.prow .btn{min-height:56px;border-radius:14px;font-size:1.05rem}
.btn--no{background:#fff;color:var(--red);border:1.5px solid #f2c4c0}
.btn--go{flex:1;background:var(--green)}
.btn--go.is-hit{background:#27692a}
.ptoast{position:absolute;left:50%;top:12px;z-index:5;transform:translate(-50%,-20px);opacity:0;background:var(--ink);color:#fff;font-size:.9rem;font-weight:600;padding:.7rem 1.1rem;border-radius:12px;box-shadow:var(--shadow);transition:opacity .25s,transform .25s;white-space:nowrap}
.ptoast.is-on{opacity:1;transform:translate(-50%,0)}

/* fast-forward (jumping to a step) and pause */
.ff,.ff *,.ff *::before,.ff *::after{transition:none!important;animation-duration:0s!important;animation-delay:0s!important}
.is-paused,.is-paused *,.is-paused *::before,.is-paused *::after{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){.float{animation:none}}

/* ================= language picker (first screen) ================= */
.say,.flow{transition:opacity .45s var(--ease)}
.m-pick .say,.m-pick .flow{opacity:0;pointer-events:none}
.is-land.m-pick .phone{transform:translate(933px,1000px) scale(.94)}
.is-port.m-pick .phone{transform:translate(333px,2200px) scale(1.2)}
.pick{position:absolute;inset:0;z-index:40;opacity:0;visibility:hidden;transition:opacity .45s var(--ease),visibility 0s .45s}
.m-pick .pick{opacity:1;visibility:visible;transition:opacity .45s var(--ease)}
.pick__head{position:absolute;color:var(--cream)}
.is-land .pick__head{left:72px;top:300px;width:540px}
.is-port .pick__head{left:80px;right:80px;top:300px}
.pick__title{font-family:var(--display);font-weight:400;font-size:64px;line-height:1.05;letter-spacing:-.01em;text-wrap:balance}
.pick__others{list-style:none;margin-top:22px;font-size:22px;font-weight:600;line-height:1.7;color:rgba(255,246,223,.66)}
.is-port .pick__title{font-size:84px}
.is-port .pick__others{font-size:30px}
.pick__grid{position:absolute;display:grid;gap:24px}
.is-land .pick__grid{left:700px;top:228px;width:820px;grid-template-columns:1fr 1fr}
.is-port .pick__grid{left:80px;right:80px;top:720px;grid-template-columns:1fr;gap:28px}
.lang-card{display:flex;flex-direction:column;align-items:flex-start;gap:16px;text-align:left;background:var(--cream);color:var(--ink);border:0;border-radius:28px;padding:30px 32px 28px;cursor:pointer;box-shadow:0 18px 40px rgba(0,0,0,.28);transition:transform .2s var(--ease),box-shadow .2s var(--ease);font:inherit}
.lang-card:hover{transform:translateY(-4px);box-shadow:0 26px 50px rgba(0,0,0,.36)}
.lang-card:focus-visible{outline:4px solid var(--y);outline-offset:5px}
.lang-card .flag{width:84px;height:56px;border-radius:8px}
.lang-card__t{display:grid;gap:6px}
.lang-card b{font-family:var(--display);font-weight:400;font-size:40px;line-height:1.05;color:var(--g)}
.lang-card small{font-size:18px;font-weight:600;color:var(--ink-2)}
.is-port .lang-card{flex-direction:row;align-items:center;gap:36px;padding:36px 44px}
.is-port .lang-card .flag{width:120px;height:80px;border-radius:10px}
.is-port .lang-card b{font-size:54px}
.is-port .lang-card small{font-size:26px}
.controls .flag{width:21px;height:14px;border-radius:3px}
.controls button:disabled{opacity:.35;cursor:default}
</style>
</head>
<body>

<div class="viewport" id="viewport">
  <div class="stage is-land m-pick" id="stage">
    <!-- copy -->
    <section class="copy">
      <div class="brandline">
        <img src="img/social/logo-mark.jpg" alt="">
        <div><b>Uncle Tan's Asian Express</b><i>Big Flavor. Fast!</i></div>
      </div>
      <div class="say" id="say" aria-live="polite">
        <p class="say__eyebrow" id="sayEyebrow"></p>
        <h1 class="say__title" id="sayTitle"></h1>
        <p class="say__text" id="sayText"></p>
      </div>
      <ol class="flow" id="flow"></ol>
    </section>

    <!-- intro stickers: real dish photos -->
    <div class="sticker"><img src="img/photos/s1.jpg" alt=""><span></span></div>

    <div class="pick" id="pick">
      <div class="pick__head"><h1 class="pick__title" id="pickTitle"></h1><ul class="pick__others" id="pickOthers"></ul></div>

</div>

  <span class="controls__sep"></span>

   Every step is a small script: `run(c)` drives the screens through `c` (wait / tap / type / scroll).
   Jumping to step N replays steps 0…N-1 in fast-forward (no waits, no transitions), so every step starts
   from the exact state the previous ones leave behind. Texts: PROMO[lang][`${key}.title`] / `.text` / `.eyebrow`. */
const STEP_DEVICES = [PHONE, PHONE, PHONE, PHONE, PHONE, PHONE, TABLET, TABLET];

/* ---------- player ---------- */
const stage = $('#stage'), finger = $('#finger');
const MODES = ['m-pick', 'm-intro', 'm-phone', 'm-both', 'm-outro'];
const P = { token: 0, scene: 0, paused: false, ff: false, picking: true, scale: 1, pausedAt: 0, pausedMs: 0 };
// play time: wall time minus the time spent paused
const clock = () => performance.now() - P.pausedMs - (P.paused ? performance.now() - P.pausedAt : 0);
class Cancel extends Error {}

function setMode(m) { stage.classList.remove(...MODES); stage.classList.add('m-' + m); }
function reset() {
  $('#phone').innerHTML = phoneHTML();
  $('#tablet').innerHTML = tabletHTML();
  curView = '#vMenu';
  setMode('intro');
  document.querySelectorAll('.sticker').forEach(s => s.classList.remove('is-on'));
  finger.classList.remove('is-on');
  live(null);
}

function makeCtx(tok) {
  const alive = () => { if (tok !== P.token) throw new Cancel(); };
  // timers, not requestAnimationFrame – browsers throttle rAF in background tabs and some recorders
  const wait = ms => {
    alive();
    if (P.ff) return Promise.resolve();
    const end = clock() + ms;
    return new Promise((res, rej) => {
      const tick = () => {
        if (tok !== P.token) return rej(new Cancel());
        const left = end - clock();
        if (left <= 0 && !P.paused) res();
        else setTimeout(tick, P.paused ? 100 : left);
      };
      setTimeout(tick, ms);
    });
  };
  // centre of an element in stage coordinates (the stage is scaled with a transform)
  const point = el => {
    const r = el.getBoundingClientRect(), s = stage.getBoundingClientRect();
    return [(r.left + r.width / 2 - s.left) / P.scale, (r.top + r.height / 2 - s.top) / P.scale];
  };
  // wait for the devices to stop moving (scrolling, sheets, layout changes) before aiming the finger
  const moving = () => document.getAnimations().filter(a => a instanceof CSSTransition && a.playState === 'running' && a.effect?.target?.closest?.('.dev'));
  const settle = async () => {
    for (let i = 0; i < 20 && !P.ff && moving().length; i++) await wait(50);
    moving().forEach(a => a.finish());           // a slow machine / throttled tab: jump to the end rather than aim at a moving target
  };
  let fx = null;
  const c = {
    wait,
    mode: setMode,
    stickers(on) {
      document.querySelectorAll('.sticker').forEach((s, i) => {
        if (P.ff) s.classList.toggle('is-on', on);
        else setTimeout(() => { if (tok === P.token) s.classList.toggle('is-on', on); }, i * 140);
      });
    },
    finger(on) { finger.classList.toggle('is-on', on && !P.ff); },
    async moveTo(sel, label = '') {
      alive();
      if (P.ff) return;
      await settle();
      const [x, y] = point($(sel));
      const first = !finger.classList.contains('is-on');
      const dist = fx ? Math.hypot(x - fx[0], y - fx[1]) : 0;
      finger.style.transitionDuration = first ? '0s' : `.25s, ${Math.min(.8, .3 + dist / 900)}s`;
      finger.style.transform = `translate(${x}px, ${y}px)`;
      $('#fingerLabel').textContent = label;
      fx = [x, y];
      if (first) { void finger.offsetWidth; finger.classList.add('is-on'); await wait(250); }
      else await wait(Math.min(800, 300 + dist / 900 * 1000) + 120);
    },
    async tap(sel, label) {
      await c.moveTo(sel, label);
      if (P.ff) return;
      const el = $(sel);
      finger.classList.remove('is-press'); void finger.offsetWidth;
      finger.classList.add('is-press');
      el.classList.add('is-hit');
      await wait(260);
      el.classList.remove('is-hit');
      finger.classList.remove('is-press');
      await wait(120);
    },
    async type(sel, text) {
      const el = $(sel);
      await c.moveTo(sel, '');
      document.querySelectorAll('.inp.is-focus').forEach(i => i.classList.remove('is-focus'));
      el.classList.add('is-focus');
      c.finger(false);
      for (let i = 1; i <= text.length; i++) { el.textContent = text.slice(0, i); await wait(48 + (text[i - 1] === ' ' ? 60 : 0)); }
      await wait(180);
      el.classList.remove('is-focus');
    },
    async scroll(scrollerSel, targetSel, offset = 0) {
      alive();
      const sc = $(scrollerSel), viewH = sc.parentElement.clientHeight, max = Math.max(0, sc.scrollHeight - viewH);
      let y;
      if (targetSel === 'end') y = max;
      else { let el = $(targetSel); y = 0; while (el && el !== sc) { y += el.offsetTop; el = el.offsetParent; } y -= offset; }
      y = Math.max(0, Math.min(max, y));
      sc.style.transform = `translateY(${-y}px)`;
      const fixed = sc.parentElement.querySelector('.cats--fixed');
      if (fixed) fixed.classList.toggle('is-on', y > $('.hdr').offsetHeight);
      await wait(850);
    },
  };
  return c;
}

function setCopy(scene) {
  const say = $('#say');
  const fill = () => {
    const n = STEP_DEVICES.length;
    $('#sayEyebrow').innerHTML = scene.step >= 0 && scene.step < n
      ? `${P_('step').replace('{n}', scene.step + 1).replace('{total}', n)} · ${p(scene.step < 6 ? 'dev.phone' : 'dev.tablet')}`
      : p(scene.key + '.eyebrow');
    $('#sayTitle').innerHTML = p(scene.key + '.title');
    $('#sayText').innerHTML = p(scene.key + '.text');
    say.classList.remove('is-out');
  };
  document.querySelectorAll('#flow li').forEach((li, i) => {
    li.className = i < scene.step ? 'is-done' : i === scene.step ? 'is-now' : '';
  });
  if (P.ff) return fill();
  const tok = P.token;
  say.classList.add('is-out');
  setTimeout(() => { if (tok === P.token) fill(); }, 300);
}

async function play(from = 0) {
  const tok = ++P.token;
  const c = makeCtx(tok);
  P.picking = false;
  setControls();
  try {
    reset();
    if (from > 0) {                               // replay the earlier steps instantly
      P.ff = true;
      stage.classList.add('ff');
      for (let i = 0; i < from; i++) { setCopy(SCENES[i]); await SCENES[i].run(c); }
      void stage.offsetWidth;
      stage.classList.remove('ff');
      P.ff = false;
    }
    for (let i = from; i < SCENES.length; i++) {
      P.scene = i;
      setCopy(SCENES[i]);
      await SCENES[i].run(c);
    }
    await c.wait(600);
    play(0);
  } catch (e) {
    if (!(e instanceof Cancel)) throw e;
  }
}

/* ---------- language ---------- */
function applyLang() {
  document.documentElement.lang = LANG;
  document.title = p('doc.title');
  $('#flow').setAttribute('aria-label', p('flow.aria'));
  $('#flow').innerHTML = P_('flow').map((name, i) => `<li>${name}${STEP_DEVICES[i]}</li>`).join('');
  document.querySelectorAll('.sticker span').forEach((s, i) => { s.textContent = P_('stickers')[i]; });
  $('#liveHead').textContent = p('live.head');
  $('#qrTitle').textContent = p('qr.title');
  $('#qrSub').textContent = p('qr.sub');
  $('#qr img').alt = p('qr.alt');
  $('#cLangFlag').innerHTML = FLAG_SVG[LANG];
  $('#cLangCode').textContent = langOf(LANG).label;
  $('#cLang').setAttribute('aria-label', p('c.lang'));
  $('#cPrev').setAttribute('aria-label', p('c.prev'));
  $('#cNext').setAttribute('aria-label', p('c.next'));
  $('#cHide').textContent = p('c.hide');
  $('#cHide').setAttribute('aria-label', p('c.hide_aria'));
  $('#cHint').textContent = p('c.hint');
  setPaused(P.paused, true);
}
function showPicker() {
  P.token++;                                      // stops the running timeline
  setPaused(false);
  reset();
  setMode('pick');
  P.picking = true;
  const others = LANGS.filter(l => l.code !== LANG);
  $('#pickTitle').textContent = P_('pick.title');
  $('#pickOthers').innerHTML = others.map(l => `<li lang="${l.code}">${P_('pick.title', l.code)}</li>`).join('');
  $('#pickGrid').innerHTML = LANGS.map(l => `<button class="lang-card" data-lang="${l.code}" lang="${l.code}">
      <span class="flag">${FLAG_SVG[l.code]}</span><span class="lang-card__t"><b>${l.name}</b><small>${P_('pick.sub', l.code)}</small></span></button>`).join('');
  applyLang();
  setControls();
  $(`.lang-card[data-lang="${LANG}"]`).focus({ preventScroll: true });
}
function choose(code) {
  LANG = code;
  try { localStorage.setItem('v2_lang', JSON.stringify(code)); } catch {}   // the menu remembers the same choice
  applyLang();
  play(0);
}
$('#pickGrid').addEventListener('click', e => { const b = e.target.closest('.lang-card'); if (b) choose(b.dataset.lang); });

/* ---------- layout + controls ---------- */
const params = new URLSearchParams(location.search);
let format = params.get('format') || (innerWidth / innerHeight < .8 ? 'port' : 'land');
function fit() {
  const vp = $('#viewport'), W = format === 'port' ? 1080 : 1600, H = format === 'port' ? 1920 : 900;
  P.scale = Math.min(vp.clientWidth / W, vp.clientHeight / H);
  stage.style.transform = `translate(${(vp.clientWidth - W * P.scale) / 2}px, ${(vp.clientHeight - H * P.scale) / 2}px) scale(${P.scale})`;
}
function setFormat(f, restart = true) {
  format = f;
  stage.classList.toggle('is-land', f === 'land');
  stage.classList.toggle('is-port', f === 'port');
  $('#cLand').setAttribute('aria-pressed', f === 'land');
  $('#cPort').setAttribute('aria-pressed', f === 'port');
  fit();
  if (restart && !P.picking) play(P.scene);
}
function setPaused(on, relabel = false) {
  if (on !== P.paused) {
    if (on) P.pausedAt = performance.now(); else P.pausedMs += performance.now() - P.pausedAt;
    P.paused = on;
  } else if (!relabel) return;
  stage.classList.toggle('is-paused', on);
  $('#cPlay').setAttribute('aria-label', p(on ? 'c.play' : 'c.pause'));
  $('#cPlayIcon').innerHTML = on ? '<path d="M3 2v12l11-6z"/>' : '<path d="M3 2h4v12H3zM9 2h4v12H9z"/>';
}
function setControls() { ['#cPrev', '#cPlay', '#cNext'].forEach(s => { $(s).disabled = P.picking; }); }
const jump = d => { if (!P.picking) play(Math.max(0, Math.min(SCENES.length - 1, P.scene + d))); };
const toggleUI = () => { document.body.classList.toggle('no-ui'); fit(); };

$('#cLang').onclick = showPicker;
$('#cPrev').onclick = () => jump(-1);
$('#cNext').onclick = () => jump(1);
$('#cPlay').onclick = () => setPaused(!P.paused);
$('#cLand').onclick = () => setFormat('land');
$('#cPort').onclick = () => setFormat('port');
$('#cHide').onclick = toggleUI;
addEventListener('keydown', e => {
  if (e.key === ' ') { if (e.target.closest('button') || P.picking) return; e.preventDefault(); setPaused(!P.paused); }
  else if (e.key === 'ArrowRight') jump(1);
  else if (e.key === 'ArrowLeft') jump(-1);
  else if (e.key === 'h' || e.key === 'H') toggleUI();
});
addEventListener('resize', fit);
stage.addEventListener('click', () => { if (document.body.classList.contains('no-ui')) toggleUI(); });

// ?lang=en plays straight away (recording, links per language); otherwise the viewer picks first
setFormat(format === 'port' ? 'port' : 'land', false);
document.fonts.ready.then(() => {
  const forced = params.get('lang');
  if (I18N[forced]) {
    LANG = forced;
    applyLang();
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) setPaused(true);
    play(0);
  } else showPicker();
});
</script>
</body>
</html>
