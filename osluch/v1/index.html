<!-- ===== DEMO BAR (mock only) ===== -->
<div class="demo-bar">
  <div class="wrap demo-bar__in">
    <span class="demo-bar__badge">Mock v1</span>
    <span class="demo-bar__note">Lekarze, pacjenci i recepty są fikcyjne — nic nie trafia do P1 ani ZUS</span>
    <div class="demo-bar__side" role="group" aria-label="Widok">
      <a href="#/" data-side="patient">Pacjent</a>
      <a href="#/lekarz" data-side="doctor">Lekarz</a>
    </div>
    <button type="button" class="demo-bar__btn" id="otherTabBtn" title="Otwórz drugą stronę w nowej karcie — zmiany synchronizują się na żywo">Druga karta ↗</button>
    <button type="button" class="demo-bar__btn" id="testDataBtn" aria-expanded="false" aria-controls="testData">Dane testowe</button>
  </div>
  <div class="test-data" id="testData" hidden></div>
</div>

<header class="site-header" id="header"></header>

<main id="app" tabindex="-1"></main>

<footer class="site-footer" id="footer"></footer>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="notify" id="notify" aria-live="assertive"></div>
<div id="modalRoot"></div>
<div id="printRoot"></div>

<script src="ui.js"></script>
