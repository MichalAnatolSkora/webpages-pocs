<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webpages POCs</title>
  <style>
    :root {
      --bg: #f6f5f2;
      --surface: #ffffff;
      --ink: #1a1a1a;
      --ink-2: #4a4a4a;
      --ink-3: #8a8a85;
      --line: #e4e2dc;
      --line-2: #d3d0c8;
      --chip: #f1efea;
      --chip-hover: #e6e3dc;
      --accent: #b8862e;
      --accent-ink: #ffffff;
      --mark: #fde9b8;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f0f0f;
        --surface: #181818;
        --ink: #f0f0f0;
        --ink-2: #b5b5b5;
        --ink-3: #7a7a7a;
        --line: #262626;
        --line-2: #333333;
        --chip: #222222;
        --chip-hover: #2e2e2e;
        --accent: #d4a44a;
        --accent-ink: #0f0f0f;
        --mark: #5a4512;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0f0f0f;
      --surface: #181818;
      --ink: #f0f0f0;
      --ink-2: #b5b5b5;
      --ink-3: #7a7a7a;
      --line: #262626;
      --line-2: #333333;
      --chip: #222222;
      --chip-hover: #2e2e2e;
      --accent: #d4a44a;
      --accent-ink: #0f0f0f;
      --mark: #5a4512;
      color-scheme: dark;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }

    .wrap {
      max-width: 1040px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* ---------- header ---------- */
    header { padding: 56px 0 24px; }
    h1 { font-size: 1.75rem; letter-spacing: -0.01em; }
    .subtitle { color: var(--ink-3); margin-top: 4px; }
    .subtitle b { color: var(--ink-2); font-weight: 600; }

    /* ---------- toolbar ---------- */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: color-mix(in srgb, var(--bg) 90%, transparent);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
    }
    .toolbar .wrap {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding-top: 12px;
      padding-bottom: 12px;
    }
    .search {
      flex: 1 1 260px;
      position: relative;
    }
    .search input {
      width: 100%;
      font: inherit;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line-2);
      border-radius: 8px;
      padding: 9px 40px 9px 12px;
    }
    .search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .search kbd {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      font: 12px/1 ui-monospace, Menlo, monospace;
      color: var(--ink-3);
      border: 1px solid var(--line-2);
      border-radius: 4px;
      padding: 3px 6px;
      pointer-events: none;
    }
    .search input:not(:placeholder-shown) + kbd { display: none; }
    .seg {
      display: inline-flex;
      background: var(--chip);
      border-radius: 8px;
      padding: 3px;
      gap: 2px;
    }
    .seg button, .toggle {
      font: 600 13px/1 inherit;
      font-family: inherit;
      color: var(--ink-2);
      background: none;
      border: 0;
      border-radius: 6px;
      padding: 7px 11px;
      cursor: pointer;
    }
    .seg button[aria-pressed="true"] {
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 1px 2px rgba(0,0,0,.08);
    }
    .toggle {
      border: 1px solid var(--line-2);
      background: var(--surface);
    }
    .toggle[aria-pressed="true"] {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--bg);
    }

    /* ---------- list ---------- */
    main { padding: 20px 0 80px; }
    .group-label {
      font: 600 11px/1 ui-monospace, Menlo, monospace;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin: 28px 0 10px;
    }
    .group-label:first-child { margin-top: 4px; }

    .list {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }

    .project {
      display: grid;
      grid-template-columns: minmax(200px, 300px) 1fr;
      gap: 8px 28px;
      padding: 18px 22px;
      border-top: 1px solid var(--line);
    }
    .project:first-child { border-top: 0; }

    .project h2 {
      font-size: 1.05rem;
      line-height: 1.3;
    }
    .project h2 a { color: inherit; text-decoration: none; }
    .project h2 a:hover { text-decoration: underline; text-underline-offset: 3px; }
    .desc { color: var(--ink-2); font-size: 0.875rem; margin-top: 2px; }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
      margin-top: 8px;
      font-size: 0.78rem;
      color: var(--ink-3);
    }
    .meta a { color: var(--ink-2); }
    .meta a:hover { color: var(--accent); }

    .versions {
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 6px;
    }
    .versions.notes { flex-direction: column; flex-wrap: nowrap; gap: 2px; }

    .v {
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
      padding: 6px 10px;
      background: var(--chip);
      color: var(--ink);
      font: 600 13px/1.2 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      border-radius: 6px;
      text-decoration: none;
      transition: background .15s;
    }
    .v:hover { background: var(--chip-hover); }
    .v:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .v.latest { background: var(--accent); color: var(--accent-ink); }
    .v.latest:hover { filter: brightness(1.06); }
    .v.extra { background: none; border: 1px dashed var(--line-2); color: var(--ink-2); }
    .v.extra:hover { border-color: var(--ink-3); color: var(--ink); }
    .v .note {
      display: none;
      font: 400 13px/1.3 system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: var(--ink-2);
    }
    .v.latest .note { color: inherit; opacity: .85; }
    .v.hit .note, .notes .v .note { display: inline; }
    .v.hit { box-shadow: inset 0 0 0 2px var(--accent); }

    .versions.notes .v {
      display: grid;
      grid-template-columns: 64px 1fr;
      background: none;
      padding: 5px 8px;
    }
    .versions.notes .v:hover { background: var(--chip); }
    .versions.notes .v.latest { color: var(--accent); }
    .versions.notes .v.latest .note { color: var(--ink-2); opacity: 1; }
    .versions.notes .v.extra { border: 0; }

    mark { background: var(--mark); color: inherit; border-radius: 2px; }

    .empty {
      padding: 48px 22px;
      text-align: center;
      color: var(--ink-3);
    }

    @media (max-width: 720px) {
      header { padding-top: 36px; }
      .project { grid-template-columns: 1fr; padding: 16px; }
      .versions.notes .v { grid-template-columns: 56px 1fr; }
      .search kbd { display: none; }
    }
  </style>
</head>

        base: 'reelsContent/',

        name: 'Płachta Zygalskiego',
        desc: 'Interaktywna płachta do łamania Enigmy',
        group: 'Experiments & tools',
        updated: '2026-04-08',
        base: 'numbers/',
        versions: [

        ],

    ];

    const GROUP_ORDER = ['Clients', 'Experiments & tools'];

    const $list = document.getElementById('list');
    const $q = document.getElementById('q');
    const $notes = document.getElementById('notes-toggle');
    const state = { q: '', sort: 'recent', notes: false };

    try {
      const saved = JSON.parse(localStorage.getItem('pocs-index') || '{}');
      if (saved.sort === 'az' || saved.sort === 'recent') state.sort = saved.sort;
      if (typeof saved.notes === 'boolean') state.notes = saved.notes;
    } catch (e) {}

    function save() {
      try { localStorage.setItem('pocs-index', JSON.stringify({ sort: state.sort, notes: state.notes })); } catch (e) {}
    }

    const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ł/g, 'l');
    const esc = s => (s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    function highlight(text, q) {
      if (!q) return esc(text);
      const n = norm(text);
      const i = n.indexOf(q);
      if (i < 0) return esc(text);
      return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
    }

    function href(p, entry) {
      const [label, , file] = entry;
      return p.base + (file || label + '/index.html');
    }

    function fmtDate(d) {
      return new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function chip(p, entry, cls, q) {
      const [label, note] = entry;
      const hit = q && note && norm(note).includes(q);
      const title = note ? ` title="${esc(label + ' — ' + note)}"` : '';
      return `<a class="v ${cls}${hit ? ' hit' : ''}" href="${href(p, entry)}"${title}>` +
        `<span>${highlight(label, q)}</span>` +
        (note ? `<span class="note">${highlight(note, q)}</span>` : '') +
        `</a>`;
    }

    function render() {
      const q = norm(state.q.trim());

      let items = PROJECTS.filter(p => {
        if (!q) return true;
        const hay = [p.name, p.desc, p.base, ...p.versions.flat(), ...(p.extras || []).flat()];
        return hay.some(s => norm(s).includes(q));
      });

      items.sort(state.sort === 'az'
        ? (a, b) => a.name.localeCompare(b.name, 'pl')
        : (a, b) => b.updated.localeCompare(a.updated) || a.name.localeCompare(b.name, 'pl'));

      if (!items.length) {
        $list.innerHTML = `<div class="list"><p class="empty">Nothing matches “${esc(state.q)}”.</p></div>`;
        return;
      }

      $list.innerHTML = GROUP_ORDER.map(g => {
        const rows = items.filter(p => p.group === g);
        if (!rows.length) return '';
        return `<h3 class="group-label">${esc(g)} · ${rows.length}</h3><div class="list">` + rows.map(p => {
          const last = p.versions.length - 1;
          const main = p.versions.map((v, i) => chip(p, v, i === last && p.versions.length > 1 ? 'latest' : '', q)).join('');
          const extras = (p.extras || []).map(v => chip(p, v, 'extra', q)).join('');
          const titleHref = p.overview ? p.base + p.overview : href(p, p.versions[last]);
          const meta = [
            `<span>${fmtDate(p.updated)}</span>`,
            p.versions.length > 1 ? `<span>${p.versions.length} versions</span>` : '',
            p.overview ? `<a href="${p.base + p.overview}">All versions overview</a>` : '',
            p.brief ? `<a href="${p.base + p.brief}">Brief (md)</a>` : '',
          ].join('');
          return `<article class="project">
            <div>
              <h2><a href="${titleHref}">${highlight(p.name, q)}</a></h2>
              <p class="desc">${highlight(p.desc, q)}</p>
              <div class="meta">${meta}</div>
            </div>
            <nav class="versions${state.notes ? ' notes' : ''}" aria-label="${esc(p.name)} versions">${main}${extras}</nav>
          </article>`;
        }).join('') + `</div>`;
      }).join('');
    }

    function syncControls() {
      document.querySelectorAll('[data-sort]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.sort === state.sort)));
      $notes.setAttribute('aria-pressed', String(state.notes));
      $notes.textContent = state.notes ? 'Hide notes' : 'Show notes';
    }

    document.getElementById('count-projects').textContent = PROJECTS.length;
    document.getElementById('count-versions').textContent = PROJECTS.reduce((n, p) => n + p.versions.length, 0);

    $q.addEventListener('input', () => { state.q = $q.value; render(); });
    $q.addEventListener('keydown', e => {
      if (e.key === 'Escape') { $q.value = ''; state.q = ''; render(); $q.blur(); }
    });
    document.querySelectorAll('[data-sort]').forEach(b => b.addEventListener('click', () => {
      state.sort = b.dataset.sort; save(); syncControls(); render();
    }));
    $notes.addEventListener('click', () => { state.notes = !state.notes; save(); syncControls(); render(); });
    document.addEventListener('keydown', e => {
      if (e.key === '/' && document.activeElement !== $q) { e.preventDefault(); $q.focus(); }
    });

    syncControls();
    render();
  </script>

</body>
</html>
