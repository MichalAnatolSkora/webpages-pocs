<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Klikalny prototyp systemu turniejowego kyokushin: drabinki na żywo, panel sekretarza, tablety sędziów, ekran hali.">
<title>Hajime Turnieje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@500;700&family=Noto+Serif+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
/* Layout: sticky command bar with audience-grouped views; each view is its own workspace, brackets get the full canvas.
   Identity: ai-zome indigo (brand) + aka/shiro fighter colours as the only loud semantic pair; tatami straw for the stream look. */
:root{
  --paper:#f1f2f8; --surface:#ffffff; --surface-2:#f6f7fc; --surface-3:#eceef7;
  --ink:#14183a; --ink-2:#4b5175; --ink-3:#83889f; --line:#dfe2ee; --line-2:#c7cbe0;
  --ai:#2e3db3; --ai-ink:#ffffff; --ai-soft:#e6e9fb;
  --aka:#d4213d; --aka-ink:#ffffff; --aka-soft:#fde7ea;
  --shiro:#ffffff; --shiro-ink:#14183a; --shiro-edge:#bfc4db;
  --gold:#c4951a; --silver:#8b95ab; --bronze:#b3683a;
  --ok:#14895a; --ok-soft:#e0f4ea; --warn:#a96f00; --warn-soft:#fcf0d4; --bad:#c42a2a; --bad-soft:#fde5e5;
  --hero-bg:#1a2370; --hero-ink:#ffffff; --hero-dim:#aab3ee;
  --shadow:0 1px 2px rgba(20,24,58,.06),0 10px 28px -14px rgba(20,24,58,.22);
  --f-display:'Archivo','Arial Narrow',system-ui,sans-serif;
  --f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --f-jp:'Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif;
  /* hall screen + stream: one dark look in both themes */
  --sb-bg:#080a1a; --sb-panel:#121633; --sb-ink:#ffffff; --sb-dim:#8a90bb; --sb-aka:#e01f3d; --sb-shiro:#f3f4fb; --sb-shiro-ink:#0c0f24; --sb-gold:#f2c84b;
  --tat-1:#b9b07a; --tat-2:#a59c66; --tat-edge:#2a3a2a;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0b0e22; --surface:#141834; --surface-2:#1a1f40; --surface-3:#21274d;
  --ink:#eceefb; --ink-2:#b0b5d6; --ink-3:#7a80a6; --line:#262c56; --line-2:#363d6e;
  --ai:#8d9cff; --ai-ink:#0b0e22; --ai-soft:#222a5e;
  --aka:#ff4a62; --aka-ink:#ffffff; --aka-soft:#3b1526;
  --shiro:#eceefb; --shiro-ink:#0b0e22; --shiro-edge:#eceefb;
  --gold:#e5b843; --silver:#aab3c8; --bronze:#d48a55;
  --ok:#3ccf8e; --ok-soft:#11352a; --warn:#f0b53a; --warn-soft:#3a2d10; --bad:#ff6a6a; --bad-soft:#3d1717;
  --hero-bg:#1a2058; --hero-ink:#ffffff; --hero-dim:#9aa4e6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0b0e22; --surface:#141834; --surface-2:#1a1f40; --surface-3:#21274d;
  --ink:#eceefb; --ink-2:#b0b5d6; --ink-3:#7a80a6; --line:#262c56; --line-2:#363d6e;
  --ai:#8d9cff; --ai-ink:#0b0e22; --ai-soft:#222a5e;
  --aka:#ff4a62; --aka-ink:#ffffff; --aka-soft:#3b1526;
  --shiro:#eceefb; --shiro-ink:#0b0e22; --shiro-edge:#eceefb;
  --gold:#e5b843; --silver:#aab3c8; --bronze:#d48a55;
  --ok:#3ccf8e; --ok-soft:#11352a; --warn:#f0b53a; --warn-soft:#3a2d10; --bad:#ff6a6a; --bad-soft:#3d1717;
  --hero-bg:#1a2058; --hero-ink:#ffffff; --hero-dim:#9aa4e6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--ai)}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1360px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:none}
.hanko{width:34px;height:34px;border-radius:7px;background:var(--aka);color:var(--aka-ink);display:grid;place-items:center;font:900 20px/1 var(--f-jp);transform:rotate(-4deg);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--aka-ink) 35%,transparent)}
.brand b{font:900 19px/1 var(--f-display);font-stretch:118%;letter-spacing:.01em}
.brand small{display:block;font:500 10.5px/1.2 var(--f-mono);color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.nav{display:flex;gap:16px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding-block:2px}
.nav::-webkit-scrollbar{display:none}
.nav-g{display:flex;align-items:center;gap:2px;flex:none}
.nav-g>span{font:600 9.5px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);margin-right:6px}
.nav a{padding:7px 11px;border-radius:999px;text-decoration:none;color:var(--ink-2);font-weight:600;font-size:13.5px;white-space:nowrap}
.nav a:hover{background:var(--surface-3);color:var(--ink)}
.nav a.on{background:var(--ink);color:var(--paper)}
.tools{display:flex;gap:8px;align-items:center;flex:none}
.chipbtn{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 11px;font:600 12px/1 var(--f-mono);color:var(--ink-2)}
.chipbtn[aria-pressed="true"]{background:var(--ai);border-color:var(--ai);color:var(--ai-ink)}
.lang{font:600 12px/1 var(--f-mono);color:var(--ink-3)}
.lang b{color:var(--ink)}

main{max-width:1360px;margin:0 auto;padding:22px 20px 80px}
.fid{display:none;font:600 10px/1 var(--f-mono);color:var(--ai);background:var(--ai-soft);border:1px dashed var(--ai);padding:3px 6px;border-radius:5px;vertical-align:middle;margin-left:6px;white-space:nowrap;letter-spacing:.02em}
body.fids .fid{display:inline-block}
.eyebrow{font:600 11px/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h3{font-size:15px;font-stretch:105%;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.muted{color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 9px;font:600 11px/1.4 var(--f-mono);background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.live{background:var(--aka-soft);color:var(--aka)} .pill.ai{background:var(--ai-soft);color:var(--ai)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.live .dot,.live-pill i{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--ai);border-color:var(--ai);color:var(--ai-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.seg{display:inline-flex;background:var(--surface-3);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.club-dot{width:9px;height:9px;border-radius:3px;background:var(--c);display:inline-block;flex:none}
.belt{display:inline-block;width:22px;height:7px;border-radius:2px;background:var(--b);position:relative;vertical-align:middle;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.belt.st::after{content:"";position:absolute;right:3px;top:0;bottom:0;width:4px;background:var(--s)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font:600 10.5px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.offline-banner{display:flex;gap:10px;align-items:center;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;margin-bottom:16px}

/* ---------- hero / public ---------- */
.hero{position:relative;overflow:hidden;background:var(--hero-bg);color:var(--hero-ink);border-radius:20px;padding:30px 30px 26px;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(90deg,transparent 0 118px,rgba(255,255,255,.05) 118px 120px),repeating-linear-gradient(0deg,transparent 0 58px,rgba(255,255,255,.035) 58px 60px)}
.hero-kanji{position:absolute;right:22px;top:-6px;z-index:-1;font:900 150px/1 var(--f-jp);writing-mode:vertical-rl;color:rgba(255,255,255,.07);letter-spacing:-.05em}
.hero-eyebrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font:600 12px/1.4 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--hero-dim)}
.live-pill{display:inline-flex;align-items:center;gap:7px;background:var(--aka);color:#fff;border-radius:999px;padding:4px 10px}
.live-pill i{width:7px;height:7px;border-radius:50%;background:#fff}
.hero-title{font-size:clamp(38px,6.4vw,78px);font-weight:900;font-stretch:122%;letter-spacing:-.01em;margin:14px 0 18px;line-height:.95}
.hero-title span{font-stretch:70%;font-weight:300;color:var(--hero-dim)}
.hero-stats{display:flex;flex-wrap:wrap;gap:12px 30px;align-items:flex-end}
.hs b{display:block;font:800 26px/1 var(--f-display);font-stretch:110%}
.hs span{font:500 11px/1.3 var(--f-mono);color:var(--hero-dim);text-transform:uppercase;letter-spacing:.08em}
.hs-prog{flex:1;min-width:200px;max-width:360px}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#fff,var(--hero-dim));border-radius:9px}
.subtabs{display:flex;gap:4px;margin:18px 0 18px;overflow-x:auto;border-bottom:1px solid var(--line)}
.subtabs button,.subtabs a{border:0;background:none;padding:10px 14px;font-weight:600;font-size:14px;color:var(--ink-2);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.subtabs .on{color:var(--ink);border-bottom-color:var(--aka)}
.subtabs a::after{content:" ↗";color:var(--ink-3)}
.live-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.mats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.mat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mat.is-live{border-color:color-mix(in srgb,var(--aka) 45%,var(--line))}
.mat-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mat-n{font:900 22px/1 var(--f-display);font-stretch:120%}
.mat-n small{font:600 11px var(--f-mono);color:var(--ink-3);letter-spacing:.08em;margin-left:2px}
.mat-cat{font-size:13px;color:var(--ink-2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.vs>div{padding:9px 10px;min-width:0}
.vs .a{background:var(--aka);color:var(--aka-ink)}
.vs .b{background:var(--shiro);color:var(--shiro-ink);text-align:right}
.vs .mid{background:var(--surface-2);display:grid;place-items:center;padding:0 10px;font:700 15px/1 var(--f-mono)}
.vs b{display:block;font:800 14px/1.15 var(--f-display);font-stretch:85%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs small{font-size:11px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.wa-pips{display:inline-flex;gap:3px;margin-top:4px}
.wa-pips i{width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor;opacity:.7}
.wa-pips i.on{background:currentColor;opacity:1}
.next-list{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--ink-2)}
.next-list div{display:flex;gap:8px;white-space:nowrap;overflow:hidden}
.next-list .mono{color:var(--ink-3);font-size:11px;flex:none;padding-top:1px}
.next-list span:last-child{overflow:hidden;text-overflow:ellipsis}
.mbar{height:4px;background:var(--surface-3);border-radius:9px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--ai)}
.feed{display:flex;flex-direction:column;gap:0;max-height:520px;overflow:auto}
.feed-i{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.feed-i:first-of-type{border-top:0}
.feed-i .tm{font:600 12px/1.5 var(--f-mono);color:var(--ink-3)}
.feed-i .tt{font:600 10px var(--f-mono);color:var(--ink-3);display:block;margin-bottom:2px;letter-spacing:.06em}
.feed-i.sys{color:var(--ink-2)}
.feed-i.fresh{animation:freshbg 2.4s ease-out}
@keyframes freshbg{0%{background:var(--ai-soft)}100%{background:transparent}}
.program{margin-top:18px}
.prog-track{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;position:relative;margin-top:6px}
.prog-step{border-top:3px solid var(--line-2);padding:10px 10px 0 0;font-size:13px}
.prog-step.done{border-color:var(--ink-3)} .prog-step.now{border-color:var(--aka)}
.prog-step b{display:block;font:700 13px var(--f-mono)}
.prog-step span{color:var(--ink-2)}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.dl dt{color:var(--ink-3);font:600 11px/1.9 var(--f-mono);text-transform:uppercase;letter-spacing:.06em}
.dl dd{margin:0}
.locked{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px dashed var(--line-2);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--ink-2)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.filters button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center;color:var(--ink-2)}
.filters button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* ---------- brackets ---------- */
.bk-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start}
.cat-list{display:flex;flex-direction:column;gap:6px;position:sticky;top:76px}
.cat-btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.cat-btn.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cat-btn b{font:800 14px/1.2 var(--f-display);font-stretch:92%}
.cat-btn .row{display:flex;justify-content:space-between;gap:6px;align-items:center;font-size:12px;color:var(--ink-3)}
.cat-more{font-size:12.5px;color:var(--ink-3);padding:6px 4px}
.bk-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;align-items:flex-end;margin-bottom:12px}
.bk-head h2{font-size:clamp(24px,3vw,34px);font-weight:900;font-stretch:112%}
.bk-head h2 span{font-stretch:75%;font-weight:500;color:var(--ink-2)}
.meta-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2);margin:6px 0 12px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .hint{color:var(--ink-3);margin-left:auto;font-size:12px}
.bk-wrap{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:auto;-webkit-overflow-scrolling:touch}
.bk{position:relative;margin:18px 22px 22px}
.bk svg.cn-layer{position:absolute;inset:0;overflow:visible;pointer-events:none}
.cn{fill:none;stroke:var(--line-2);stroke-width:1.5}
.cn.done{stroke:var(--ink-3)}
.cn.pend{stroke-dasharray:3 4}
.cn.hl{stroke:var(--hc,var(--ai));stroke-width:3;opacity:1}
.r-head{position:absolute;top:0;font:600 10.5px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.bout{position:absolute}
.bout-tag{position:absolute;left:0;right:0;top:-19px;height:17px;display:flex;justify-content:space-between;align-items:center;border:0;background:none;padding:0 2px;font:600 10.5px/1 var(--f-mono);color:var(--ink-3);letter-spacing:.03em}
.bout-tag:hover .no{color:var(--ai);text-decoration:underline}
.bout-box{border:1px solid var(--line-2);border-radius:9px;background:var(--surface);overflow:hidden;box-shadow:0 1px 0 var(--line)}
.slot{display:grid;grid-template-columns:4px minmax(0,1fr) auto 18px;align-items:center;gap:8px;height:30px;width:100%;border:0;background:none;text-align:left;padding:0 9px 0 0;color:var(--ink);transition:opacity .15s,background .15s}
.slot+.slot{border-top:1px solid var(--line)}
.slot i{align-self:stretch;background:var(--c,transparent)}
.slot .nm{font:650 13.5px/1 var(--f-display);font-stretch:82%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .cl{font:500 9.5px/1 var(--f-mono);color:var(--ink-3);letter-spacing:.04em}
.slot .rs{font:700 10.5px/1 var(--f-mono);text-align:right;color:var(--ink-3)}
.slot.win{background:var(--surface-2)}
.slot.win .nm{font-weight:850}
.slot.win .rs{color:var(--ink)}
.slot.lose .nm{color:var(--ink-3);font-weight:500}
.slot.ph .nm{color:var(--ink-3);font-weight:500;font-style:italic;font-family:var(--f-body);font-size:12px}
.slot.fol .nm::after{content:" ★";color:var(--gold)}
.bout.s-live .bout-box{border-color:var(--aka);box-shadow:0 0 0 3px var(--aka-soft)}
.bout.s-live .bout-tag .m{color:var(--aka)}
.bout.s-ready .bout-tag .m{color:var(--ai)}
.bout.s-bye .bout-box{border-style:dashed;opacity:.6;box-shadow:none}
.bout.fresh .bout-box{animation:fresh 2.2s ease-out}
@keyframes fresh{0%{box-shadow:0 0 0 8px var(--ai-soft);border-color:var(--ai)}100%{box-shadow:0 0 0 0 transparent}}
.bk.has-hl .slot:not(.hl){opacity:.28}
.bk.has-hl .cn:not(.hl){opacity:.35}
.slot.hl{background:color-mix(in srgb,var(--hc) 16%,var(--surface))}
.champ{position:absolute;border-radius:14px;padding:14px;text-align:center;background:linear-gradient(160deg,color-mix(in srgb,var(--gold) 22%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--gold) 55%,var(--line))}
.champ .k{font:900 26px/1 var(--f-jp);color:var(--gold)}
.champ .l{font:600 10px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:6px 0 4px}
.champ b{font:900 17px/1.15 var(--f-display);font-stretch:90%;display:block}
.bronze-lbl{position:absolute;font:600 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--bronze)}
.drop{animation:drop .5s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes drop{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:none}}
.mandala{display:block;width:100%;max-width:820px;margin:0 auto;height:auto}
.mandala text{font-family:var(--f-display)}
.m-ring{fill:none;stroke:var(--line);stroke-dasharray:2 5}
.m-seg{fill:none;stroke:var(--line-2);stroke-width:1.4;transition:opacity .15s}
.m-seg.adv{stroke:var(--hc);stroke-width:3.2}
.m-seg.pend{stroke-dasharray:3 4}
.m-seg.live{stroke:var(--aka);stroke-width:2.6;animation:pulse 1.4s infinite}
.m-name{font-size:12.5px;font-weight:650;font-stretch:82%;fill:var(--ink);cursor:pointer}
.m-name.lost{fill:var(--ink-3);font-weight:500}
.m-node{stroke:var(--surface);stroke-width:2}
.bk.has-hl .m-seg:not(.hl),.bk.has-hl .m-name:not(.hl){opacity:.22}
.m-seg.hl{stroke-width:4.4}
.pool{display:flex;flex-wrap:wrap;gap:8px;padding:22px}
.pool-c{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:999px;padding:7px 12px 7px 9px;font-weight:600;font-size:14px;background:var(--surface-2)}
.pool-cta{padding:0 22px 22px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--ok);font-weight:600;padding:0 22px 18px}
.rr{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;padding:22px}
.rr table td.cell{text-align:center;font:700 12px var(--f-mono)}
.rr td.self{background:repeating-linear-gradient(45deg,var(--surface-3) 0 4px,transparent 4px 8px)}
.rr td.W{color:var(--ok)} .rr td.L{color:var(--ink-3)}

/* ---------- secretary ---------- */
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:16px}
.sec-head h1{font-size:clamp(24px,3.2vw,36px);font-weight:900;font-stretch:115%}
.sec-head h1 span{display:block;font-size:15px;font-weight:600;font-stretch:100%;color:var(--ink-2);margin-top:6px;font-family:var(--f-body)}
.net{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none}
.switch input{appearance:none;width:34px;height:20px;border-radius:99px;background:var(--line-2);position:relative;margin:0;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch input:checked{background:var(--warn)}
.switch input:checked::after{transform:translateX(14px)}
.sec-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,320px) minmax(0,1fr);gap:14px}
.corner{border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;min-width:0}
.corner.aka{background:var(--aka);color:var(--aka-ink)}
.corner.shiro{background:var(--shiro);color:var(--shiro-ink);border:2px solid var(--shiro-edge)}
.corner .kj{position:absolute;right:12px;top:4px;font:900 82px/1 var(--f-jp);opacity:.12;pointer-events:none}
.corner .side{font:700 11px var(--f-mono);letter-spacing:.16em;opacity:.8}
.corner .fname{font:900 clamp(22px,2.6vw,30px)/1.05 var(--f-display);font-stretch:90%}
.corner .fmeta{font-size:13px;opacity:.85;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.score-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.wa-big{display:flex;gap:8px}
.wa-big i{width:34px;height:34px;border-radius:50%;border:3px solid currentColor;opacity:.45}
.wa-big i.on{background:currentColor;opacity:1}
.chui{display:flex;gap:5px;align-items:center;font:600 11px var(--f-mono)}
.chui i{width:14px;height:14px;border-radius:3px;border:2px solid currentColor;opacity:.45}
.chui i.on{background:currentColor;opacity:1}
.corner-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cbtn{border:0;border-radius:12px;padding:13px 10px;font:800 15px/1.1 var(--f-display);font-stretch:95%;display:flex;flex-direction:column;align-items:center;gap:3px}
.cbtn small{font:500 10px var(--f-mono);opacity:.75;letter-spacing:.06em}
.aka .cbtn{background:rgba(255,255,255,.16);color:inherit}
.aka .cbtn:hover{background:rgba(255,255,255,.26)}
.aka .cbtn.main{background:#fff;color:var(--aka)}
.shiro .cbtn{background:var(--surface-3);color:var(--ink)}
.shiro .cbtn:hover{background:var(--line)}
.shiro .cbtn.main{background:var(--ink);color:var(--paper)}
.corner.won{outline:4px solid var(--gold);outline-offset:-4px}
.clock{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.clock .phase{font:700 11px var(--f-mono);letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase}
.clock .time{font:800 72px/1 var(--f-display);font-stretch:105%;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.clock .time.run{color:var(--ok)}
.clock .time.end{color:var(--aka);animation:pulse .8s infinite}
.go{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.go .btn{padding:12px}
.hajime{background:var(--ok)!important;border-color:var(--ok)!important;color:#fff!important;font:800 17px/1 var(--f-display)!important;font-stretch:110%!important}
.yame{background:var(--aka)!important;border-color:var(--aka)!important;color:#fff!important;font:800 17px/1 var(--f-display)!important;font-stretch:110%!important}
.kbd{font:600 10.5px var(--f-mono);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--ink-3)}
.rules{font-size:12px;color:var(--ink-3);line-height:1.5}
.sec-lower{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr);gap:14px;margin-top:14px}
.sec-lower2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;margin-top:14px}
.flags{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.flag{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font:600 10px var(--f-mono);color:var(--ink-3);text-align:center}
.flag svg{width:30px;height:30px}
.flag.wait svg{opacity:.3}
.hres{margin-top:12px;font-weight:700;font-size:14px}
.win-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.win-pick button{border:2px solid var(--line-2);border-radius:12px;padding:10px;font-weight:700;background:var(--surface);text-align:left;min-width:0}
.win-pick button small{display:block;font:600 10px var(--f-mono);letter-spacing:.12em;color:var(--ink-3)}
.win-pick button span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-display);font-stretch:88%}
.win-pick button.a.on{border-color:var(--aka);background:var(--aka-soft)}
.win-pick button.b.on{border-color:var(--ink);background:var(--surface-3)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;font-size:12.5px;color:var(--ink-2);font-weight:600}
.field select,.field input{border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:9px 10px;font-size:14px;font-weight:500;color:var(--ink)}
.log{display:flex;flex-direction:column;max-height:230px;overflow:auto}
.log-i{display:grid;grid-template-columns:46px 62px 1fr auto;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px;align-items:center}
.log-i:first-child{border-top:0}
.log-i .s{font:700 10px var(--f-mono);letter-spacing:.1em;border-radius:5px;padding:2px 6px;text-align:center}
.log-i .s.a{background:var(--aka);color:var(--aka-ink)} .log-i .s.b{background:var(--shiro);color:var(--shiro-ink);box-shadow:inset 0 0 0 1px var(--shiro-edge)} .log-i .s.x{background:var(--surface-3);color:var(--ink-2)}
.sync{font:600 11px var(--f-mono)}
.sync.ok{color:var(--ok)} .sync.q{color:var(--warn)}
.ann{display:flex;flex-direction:column;gap:8px;max-height:230px;overflow:auto}
.ann-i{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:var(--surface-2);border-radius:10px;padding:9px 10px;font-size:13.5px}
.play{width:30px;height:30px;border-radius:50%;border:0;background:var(--ai);color:var(--ai-ink);display:grid;place-items:center}
.play svg{width:12px;height:12px}
.done-box{text-align:center;padding:40px 20px}

/* ---------- scoreboard (container-query scaled) ---------- */
.sbw{container-type:inline-size;width:100%}
.sb{position:relative;aspect-ratio:16/9;max-width:100%;background:var(--sb-bg);color:var(--sb-ink);border-radius:2cqw;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;font-family:var(--f-display)}
.sb-top{display:flex;justify-content:space-between;padding:1.6cqw 2.4cqw;font:700 1.5cqw/1 var(--f-mono);letter-spacing:.14em;color:var(--sb-dim);text-transform:uppercase}
.sb-top b{color:var(--sb-ink)}
.sb-main{display:grid;grid-template-columns:1fr 26cqw 1fr;gap:1.2cqw;padding:0 1.6cqw}
.sb-side{border-radius:1.4cqw;padding:2cqw 2.2cqw;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;min-width:0}
.sb-side.a{background:var(--sb-aka)}
.sb-side.b{background:var(--sb-shiro);color:var(--sb-shiro-ink);text-align:right;align-items:flex-end}
.sb-k{position:absolute;font:900 22cqw/1 var(--f-jp);opacity:.1;bottom:-4cqw;left:-1cqw}
.sb-side.b .sb-k{left:auto;right:-1cqw}
.sb-name{font-size:4.4cqw;font-weight:900;font-stretch:85%;line-height:1;position:relative}
.sb-club{font-size:1.7cqw;opacity:.8;margin-top:.6cqw;position:relative;font-family:var(--f-body)}
.sb-wa{display:flex;gap:1cqw;position:relative}
.sb-wa i{width:4.6cqw;height:4.6cqw;border-radius:50%;border:.5cqw solid currentColor;opacity:.35}
.sb-wa i.on{background:currentColor;opacity:1}
.sb-lbl{font:700 1.3cqw var(--f-mono);letter-spacing:.14em;opacity:.75;margin-bottom:.6cqw;position:relative}
.sb-ch{display:flex;gap:.6cqw;position:relative}
.sb-ch i{width:2cqw;height:2cqw;border-radius:.4cqw;border:.35cqw solid currentColor;opacity:.35}
.sb-ch i.on{background:currentColor;opacity:1}
.sb-clock{background:var(--sb-panel);border-radius:1.4cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1cqw}
.sb-time{font-size:9.5cqw;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em}
.sb-time.end{color:var(--sb-aka)}
.sb-phase{font:700 1.4cqw var(--f-mono);letter-spacing:.16em;color:var(--sb-dim)}
.sb-phase.encho{color:var(--sb-gold)}
.sb-next{padding:1.4cqw 2.4cqw;font:600 1.5cqw/1 var(--f-mono);color:var(--sb-dim);letter-spacing:.06em;display:flex;gap:1.4cqw;white-space:nowrap;overflow:hidden}
.sb-next b{color:var(--sb-ink);font-weight:700}
.sb-flash{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,10,26,.72);animation:flash 1.8s ease-out both;pointer-events:none}
.sb-flash div{font:900 22cqw/1 var(--f-jp);text-shadow:0 0 4cqw rgba(0,0,0,.5)}
.sb-flash div.a{color:var(--sb-aka)} .sb-flash div.b{color:var(--sb-shiro)}
.sb-flash small{display:block;text-align:center;font:800 2.4cqw var(--f-display);letter-spacing:.3em;color:var(--sb-ink);margin-top:1cqw}
@keyframes flash{0%{opacity:0;transform:scale(1.1)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
/* stream overlay */
.ov{position:relative;aspect-ratio:16/9;border-radius:2cqw;overflow:hidden;background:
 radial-gradient(ellipse at 50% 60%,transparent 30%,rgba(0,0,0,.55) 100%),
 repeating-linear-gradient(90deg,var(--tat-1) 0 12cqw,var(--tat-2) 12cqw 24cqw);font-family:var(--f-display)}
.ov::before{content:"";position:absolute;left:14%;right:14%;top:18%;bottom:10%;border:.5cqw solid rgba(160,30,40,.55);transform:perspective(60cqw) rotateX(38deg)}
.ov-cam{position:absolute;left:2cqw;top:2cqw;font:700 1.3cqw var(--f-mono);color:rgba(255,255,255,.85);letter-spacing:.14em;display:flex;gap:.8cqw;align-items:center}
.ov-cam i{width:1cqw;height:1cqw;border-radius:50%;background:var(--sb-aka);animation:pulse 1.4s infinite}
.ov-bug{position:absolute;right:2cqw;top:2cqw;background:rgba(8,10,26,.85);color:#fff;padding:1cqw 1.6cqw;border-radius:.8cqw;font:800 1.5cqw/1.2 var(--f-display);font-stretch:115%;text-align:right}
.ov-bug small{display:block;font:600 1.1cqw var(--f-mono);color:var(--sb-dim);letter-spacing:.1em}
.ov-lt{position:absolute;left:2.4cqw;bottom:2.4cqw;display:grid;grid-template-columns:auto auto;border-radius:1cqw;overflow:hidden;box-shadow:0 1cqw 3cqw rgba(0,0,0,.4)}
.ov-rows{display:flex;flex-direction:column}
.ov-row{display:grid;grid-template-columns:3.4cqw 26cqw 6cqw;align-items:center;height:4.4cqw}
.ov-row .c{height:100%;display:grid;place-items:center;font:900 1.8cqw var(--f-jp)}
.ov-row.a .c{background:var(--sb-aka);color:#fff} .ov-row.b .c{background:var(--sb-shiro);color:var(--sb-shiro-ink)}
.ov-row .n{background:rgba(8,10,26,.9);color:#fff;height:100%;display:flex;align-items:center;padding:0 1.4cqw;font-size:2cqw;font-weight:800;font-stretch:88%;gap:1cqw;white-space:nowrap;overflow:hidden}
.ov-row .n small{font:500 1.2cqw var(--f-body);color:var(--sb-dim)}
.ov-row .p{background:rgba(18,22,51,.95);height:100%;display:flex;align-items:center;justify-content:center;gap:.6cqw}
.ov-row .p i{width:1.3cqw;height:1.3cqw;border-radius:50%;border:.25cqw solid #fff;opacity:.4}
.ov-row .p i.on{background:var(--sb-gold);border-color:var(--sb-gold);opacity:1}
.ov-t{background:var(--sb-bg);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 1.8cqw;font-size:3.4cqw;font-weight:800;font-variant-numeric:tabular-nums}
.ov-t small{font:700 1cqw var(--f-mono);color:var(--sb-dim);letter-spacing:.14em}
.ekran-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.qr-tile{background:#fff;border-radius:12px;padding:12px;display:inline-block}
.qr-tile canvas{display:block;width:150px;height:150px;image-rendering:pixelated}

/* ---------- devices ---------- */
.device-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:34px;align-items:start}
.phone{width:min(360px,100%);border-radius:44px;border:10px solid var(--ink);background:var(--paper);overflow:hidden;box-shadow:var(--shadow);position:relative}
.phone-in{height:720px;overflow:auto;padding:46px 16px 20px;display:flex;flex-direction:column;gap:12px}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:110px;height:28px;border-radius:20px;background:var(--ink);z-index:2}
.push{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:18px;padding:10px 12px;display:grid;grid-template-columns:30px 1fr;gap:10px;font-size:13px;box-shadow:var(--shadow);animation:drop .6s .3s both}
.push .hanko{width:30px;height:30px;font-size:16px;border-radius:8px}
.push b{font-size:13px}
.push .muted{font-size:11px}
.tablet{width:min(760px,100%);border-radius:30px;border:12px solid var(--ink);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.tablet-in{padding:20px;display:flex;flex-direction:column;gap:16px;min-height:430px}
.vote-row{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;flex:1}
.vbtn{border:0;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;font:900 24px/1 var(--f-display);font-stretch:95%;min-height:230px;transition:transform .1s}
.vbtn:active{transform:scale(.98)}
.vbtn svg{width:76px;height:76px}
.vbtn small{font:600 13px var(--f-body);opacity:.85}
.vbtn.a{background:var(--aka);color:#fff}
.vbtn.b{background:var(--shiro);color:var(--shiro-ink);box-shadow:inset 0 0 0 3px var(--shiro-edge)}
.vbtn.d{background:var(--surface-3);color:var(--ink);min-height:0;padding:16px;font-size:16px}
.vbtn.d svg{width:46px;height:46px}
.vbtn.sel{outline:5px solid var(--gold);outline-offset:3px}
.vbtn:disabled{opacity:.35;cursor:not-allowed}
.step{display:grid;grid-template-columns:22px 1fr;gap:10px;position:relative;padding-bottom:14px}
.step::before{content:"";position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.step .sd{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);background:var(--surface);display:grid;place-items:center;font:700 10px var(--f-mono)}
.step.w .sd{background:var(--ok);border-color:var(--ok);color:#fff}
.step.l .sd{background:var(--bad);border-color:var(--bad);color:#fff}
.step.n .sd{border-color:var(--aka);color:var(--aka)}
.step b{font-size:14px}
.step div div{font-size:12.5px;color:var(--ink-2)}
.next-card{background:var(--ink);color:var(--paper);border-radius:18px;padding:16px}
.next-card .big{font:900 34px/1 var(--f-display);font-stretch:110%;margin:6px 0}
.next-card .eyebrow{color:color-mix(in srgb,var(--paper) 60%,transparent)}
.feat-list{display:flex;flex-direction:column;gap:14px;max-width:520px}
.feat-list div{display:grid;grid-template-columns:36px 1fr;gap:12px}
.feat-list .ic{width:36px;height:36px;border-radius:10px;background:var(--ai-soft);color:var(--ai);display:grid;place-items:center;font:900 16px var(--f-jp)}
.feat-list b{display:block;font-family:var(--f-display);font-stretch:105%}
.feat-list p{margin:2px 0 0;color:var(--ink-2);font-size:14px}

/* ---------- organizer ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi b{display:block;font:800 26px/1.1 var(--f-display);font-stretch:108%;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--ink-2)}
.kpi.warn b{color:var(--warn)}
.w-in{width:84px;border:1px solid var(--line-2);border-radius:8px;padding:6px 8px;background:var(--surface);text-align:right;font:600 14px var(--f-mono)}
.ci{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.ci.on{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.catc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.catc.alert{border-color:color-mix(in srgb,var(--warn) 60%,var(--line))}
.catc b{font:800 15px/1.2 var(--f-display);font-stretch:95%}
.cnt{display:flex;gap:2px;flex-wrap:wrap}
.cnt i{width:7px;height:14px;border-radius:2px;background:var(--ai)}
.cnt i.e{background:var(--surface-3)}
.suggest{background:var(--warn-soft);border-radius:10px;padding:10px;font-size:13px;color:var(--ink);display:flex;flex-direction:column;gap:8px}
.gantt{position:relative;min-width:760px}
.g-axis{display:grid;margin-left:90px;font:600 11px var(--f-mono);color:var(--ink-3);height:22px;position:relative}
.g-axis span{position:absolute;transform:translateX(-50%)}

function slotHTML(bout, side, cat) {

  }
  const c = club(id), isW = bout.win === id && bout.status !== 'pending', isL = bout.lose === id;
  const rs = bout.status === 'done' && isW ? (MSHORT[bout.res.m] || '✓') : bout.status === 'bye' ? '→' : '';
  const anim = cat.drawAnim ? ` drop" style="--c:${c.c};animation-delay:${(bout.i * 2 + (side === 'b' ? 1 : 0)) * 110}ms` : `" style="--c:${c.c}`;

}
function boutTag(bout, cat) {
  let m = '';

  else if (bout.status === 'done') m = bout.res.m.toUpperCase() + (bout.res.m.startsWith('Hantei') ? ' ' + bout.res.d : '');
  else if (bout.status === 'ready') m = 'NASTĘPNE';

  return `<button class="bout-tag" ${bout.no ? `data-act="bout" data-arg="${bout.id}"` : 'tabindex="-1"'}><span class="no">${bout.no ? '#' + bout.no : ''}</span><span class="m">${m}</span></button>`;
}
function treeHTML(cat) {
  const B = buildBracket(cat, true), R = B._rounds, n = cat.R1.length;
  const COLW = 214, GAP = 58, BH = 60, U = 90, TOP = 40, CHW = 176;
  const W = R * COLW + (R - 1) * GAP + GAP + CHW, H = TOP + n * U + (cat.bronze ? 30 : 0);
  let boxes = '', paths = '', heads = '';
  const yc = (r, i) => TOP + (i + 0.5) * U * 2 ** r;
  for (let r = 0; r < R; r++) {
    const x = r * (COLW + GAP);
    heads += `<div class="r-head" style="left:${x}px">${roundName(r, R)}</div>`;
    for (let i = 0; i < n / 2 ** r; i++) {
      const bout = B[`r${r}-${i}`], y = yc(r, i);
      boxes += `<div class="bout s-${bout.status} ${ui.justDone === bout.id ? 'fresh' : ''}" style="left:${x}px;top:${y - BH / 2}px;width:${COLW}px">${boutTag(bout, cat)}<div class="bout-box">${slotHTML(bout, 'a', cat)}${slotHTML(bout, 'b', cat)}</div></div>`;
      if (r < R - 1) {
        const x1 = x + COLW, x2 = (r + 1) * (COLW + GAP), y2 = yc(r + 1, i >> 1) + (i % 2 ? 15 : -15);
        const w = bout.win, cls = w ? 'done' : 'pend';
        paths += `<path class="cn ${cls}" ${w ? `data-f="${w}" style="--hc:${club(w).c}"` : ''} d="M${x1} ${y} H${x1 + GAP / 2} V${y2} H${x2}"/>`;
      }
    }
  }
  const fin = B._final, fx = (R - 1) * (COLW + GAP), fy = yc(R - 1, 0);
  const cx = R * (COLW + GAP);
  paths += `<path class="cn ${fin.win ? 'done' : 'pend'}" ${fin.win ? `data-f="${fin.win}" style="--hc:${club(fin.win).c}"` : ''} d="M${fx + COLW} ${fy} H${cx}"/>`;
  const order = cat.order || [], ahead = order.filter(id => B[id] && B[id].status !== 'done').indexOf('r' + (R - 1) + '-0');
  boxes += `<div class="champ" style="left:${cx}px;top:${fy - 62}px;width:${CHW}px"><div class="k">優勝</div><div class="l">Mistrz kategorii</div>${fin.win ? `<b>${esc(fname(fin.win))}</b><div class="muted" style="font-size:12px;margin-top:3px">${club(fin.win).name}</div>` : `<b class="muted" style="font-weight:600">jeszcze nie wiemy</b><div class="muted" style="font-size:12px;margin-top:3px">${fin.no ? `finał #${fin.no}` : 'finał'}${ahead >= 0 && cat.live ? ` · ok. ${hm(simClock + ahead * 4)}` : ''}</div>`}</div>`;
  if (cat.bronze) {
    const bz = B.b3, by = fy + 150;
    boxes += `<div class="bronze-lbl" style="left:${fx}px;top:${by - 52}px">O 3. miejsce</div><div class="bout s-${bz.status} ${ui.justDone === 'b3' ? 'fresh' : ''}" style="left:${fx}px;top:${by - BH / 2}px;width:${COLW}px">${boutTag(bz, cat)}<div class="bout-box">${slotHTML(bz, 'a', cat)}${slotHTML(bz, 'b', cat)}</div></div>`;
  }
  return `<div class="bk" style="width:${W}px;height:${H}px">${heads}<svg class="cn-layer" width="${W}" height="${H}" aria-hidden="true">${paths}</svg>${boxes}</div>`;
}
function mandalaHTML(cat) {
  const B = buildBracket(cat, true), R = B._rounds, N = cat.R1.length * 2;
  const RAD = [330, 252, 176, 100, 0].slice(0, R).concat([0]);
  if (R === 3) { RAD.splice(0, RAD.length, 300, 200, 100, 0); }
  const ang = (L, j) => ((j + 0.5) / (N / 2 ** L)) * 2 * Math.PI - Math.PI / 2;
  const P = (r, a) => `${(r * Math.cos(a)).toFixed(1)} ${(r * Math.sin(a)).toFixed(1)}`;
  let segs = '', segsTop = '', nodes = '', labels = '', rings = '';
  for (let L = 0; L < R; L++) rings += `<circle class="m-ring" r="${RAD[L]}"/>`;
  for (let r = 0; r < R; r++) {
    for (let i = 0; i < N / 2 ** (r + 1); i++) {
      const bout = B[`r${r}-${i}`];
      ['a', 'b'].forEach((s, k) => {
        const f = bout[s]; if (!f) return;
        const tc = ang(r, 2 * i + k), tp = ang(r + 1, i), rc = RAD[r], rp = RAD[r + 1];
        const adv = bout.win === f && bout.status !== 'pending' && bout.status !== 'live' && bout.status !== 'ready';
        const sweep = tp > tc ? 1 : 0;
        const d = rp > 0 ? `M${P(rc, tc)} L${P(rp, tc)} A${rp} ${rp} 0 0 ${sweep} ${P(rp, tp)}` : `M${P(rc, tc)} L0 0`;
        const c = club(f).c, cls = adv ? 'adv' : bout.status === 'live' ? 'live' : (bout.status === 'done' || bout.status === 'bye') ? '' : 'pend';
        const el = `<path class="m-seg ${cls}" data-f="${f}" style="--hc:${c}" d="${d}"/>`;
        if (adv) segsTop += el; else segs += el;
        nodes += `<circle class="m-node" cx="${(rc * Math.cos(tc)).toFixed(1)}" cy="${(rc * Math.sin(tc)).toFixed(1)}" r="${r === 0 ? 6 : 5}" fill="${c}"/>`;
        if (r === 0) {
          const a = tc, deg = a * 180 / Math.PI, left = Math.cos(a) < -0.001;
          const lost = B[`r0-${i}`].lose === f || isEliminated(B, f);
          labels += `<text class="m-name ${lost ? 'lost' : ''}" data-f="${f}" data-act="fighter" data-arg="${f}" transform="rotate(${left ? deg + 180 : deg}) translate(${left ? -(rc + 14) : rc + 14} 0)" text-anchor="${left ? 'end' : 'start'}" dominant-baseline="middle">${esc(F[f].n)}</text>`;
        }
      });
    }
  }

  const lim = RAD[0] + 190;

    <p class="muted" style="font-size:12.5px;padding:0 22px 18px;margin:0">Mandala: zawodnicy na obwodzie, mistrz w środku. Kolorowa linia to droga zwycięzcy w barwach klubu. Dobrze wygląda na telebimie i w social media. ${fid('wyróżnik')}</p>`;
}

function poolHTML(cat) {

function drawQR() {
  const cv = $('#qr'); if (!cv) return;
  const x = cv.getContext('2d'), n = 29; let s = 7;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  x.fillStyle = '#fff'; x.fillRect(0, 0, n, n); x.fillStyle = '#0b0e22';
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (rnd() > .52) x.fillRect(i, j, 1, 1);
  [[0, 0], [n - 7, 0], [0, n - 7]].forEach(([a, b]) => { x.fillStyle = '#fff'; x.fillRect(a - 1, b - 1, 9, 9); x.fillStyle = '#0b0e22'; x.fillRect(a, b, 7, 7); x.fillStyle = '#fff'; x.fillRect(a + 1, b + 1, 5, 5); x.fillStyle = '#0b0e22'; x.fillRect(a + 2, b + 2, 3, 3); });
}

/* ===================== secretary actions ===================== */
function phaseLen() { return sc.encho ? 60 : sc.base; }
function scLog(side, type, txt) { sc.log.unshift({ t: mmss(phaseLen() - sc.time), side, type, txt, synced: !net.offline }); }
function flash(k, txt, side) { sc.flash = { k, txt, side, until: Date.now() + 1800 }; setTimeout(() => { if (sc.flash && sc.flash.until <= Date.now()) { sc.flash = null; if (['sekretarz', 'ekran'].includes(ui.view)) render(); } }, 1850); }
let tickLast = 0;
function startTimer() { if (sc.time <= 0) return; sc.running = true; sc.ended = false; tickLast = performance.now(); scLog(null, 'sys', 'Hajime'); }
function stopTimer(silent) { if (!sc.running) return; sc.running = false; if (!silent) scLog(null, 'sys', 'Yame'); }
setInterval(() => {
  if (!sc.running) return;
  const now = performance.now(); sc.time = Math.max(0, sc.time - (now - tickLast) / 1000); tickLast = now;
  if (sc.time <= 0) { sc.running = false; sc.ended = true; scLog(null, 'sys', 'Koniec czasu'); beep(); render(); return; }
  $$('.js-time').forEach(el => el.textContent = mmss(sc.time));
}, 100);
function beep() { try { const C = new (window.AudioContext || window.webkitAudioContext)(); const o = C.createOscillator(), g = C.createGain(); o.frequency.value = 880; o.connect(g); g.connect(C.destination); g.gain.setValueAtTime(.15, C.currentTime); g.gain.exponentialRampToValueAtTime(.001, C.currentTime + .8); o.start(); o.stop(C.currentTime + .8); } catch (e) { } }
function speak(txt) { try { const u = new SpeechSynthesisUtterance(txt); u.lang = 'pl-PL'; const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('pl')); if (v) u.voice = v; speechSynthesis.cancel(); speechSynthesis.speak(u); return true; } catch (e) { return false; } }
function simulateVotes() {
  const bias = sc.a.wa > sc.b.wa ? 'a' : sc.b.wa > sc.a.wa ? 'b' : null;
  [0, 1, 3, 4].forEach((k, n) => setTimeout(() => {
    if (!sc.hantei || sc.votes[k]) return;
    const r = Math.random();
    sc.votes[k] = bias ? (r < .78 ? bias : r < .9 ? 'd' : (bias === 'a' ? 'b' : 'a')) : (r < .42 ? 'a' : r < .84 ? 'b' : 'd');
    afterVote(); if (['sekretarz', 'sedzia', 'ekran'].includes(ui.view)) render();
  }, 600 + n * 650));
}
function afterVote() {
  const r = hanteiRes(); if (!r) return;
  if (r.draw) { scLog(null, 'sys', `Hantei ${r.d}: remis`); return; }
  sc.winner = r.w; sc.method = sc.encho ? 'Hantei po encho' : 'Hantei'; sc.tech = r.d;
  scLog(r.w, 'hantei', `Hantei ${r.d}`);
}
function confirmBout() {
  const cat = CATS['b14-60'], B = buildBracket(cat, false), bout = B[cat.live];
  if (!bout || !sc.winner || !sc.method) return;
  stopTimer(true);
  const res = { w: sc.winner, m: sc.method, d: sc.tech, at: hm(simClock), pub: !net.offline, ev: sc.log.slice().reverse() };
  cat.results[bout.id] = res;
  const w = res.w === 'a' ? bout.a : bout.b, l = res.w === 'a' ? bout.b : bout.a;
  const entry = { tm: hm(simClock), t: 2, txt: `Walka #${bout.no}: <b>${esc(F[w].n)}</b> wygrywa (${res.m}${res.d ? ' · ' + esc(res.d) : ''}) · vs ${esc(F[l].n)}`, fresh: true };
  if (net.offline) net.pendingFeed.push(entry); else feed.unshift(entry);
  AUDIT.unshift({ tm: hm(simClock) + ':' + String(new Date().getSeconds()).padStart(2, '0'), who: 'Sekretarz T2 · Anna W.', what: `Walka #${bout.no} · wynik: ${F[w].n}, ${res.m}${res.d ? ' (' + res.d + ')' : ''}` });
  ann.unshift({ txt: `Zwycięża ${F[w].n}, ${club(w).name}.` });
  simClock += 4;
  const nextId = cat.order.find(id => id !== bout.id && !cat.results[id]);
  cat.live = nextId || null;
  ui.justDone = bout.id; setTimeout(() => { ui.justDone = null; }, 2500);
  const pendingLog = sc.log.filter(l => !l.synced);
  sc = SC0(); sc.log = pendingLog;
  if (nextId) {
    const nb = buildBracket(cat, false)[nextId];
    ann.unshift({ txt: `Tatami dwa, walka ${nb.no}. Na czerwono: ${F[nb.a].n}, ${club(nb.a).name}. Na biało: ${F[nb.b].n}, ${club(nb.b).name}.` });
  }
  if (annAuto) speak(ann.slice(0, 2).reverse().map(a => a.txt).join(' '));
  toast(net.offline ? `Zapisano lokalnie. Walka #${bout.no} wyśle się po powrocie sieci.` : `Walka #${bout.no} zatwierdzona. Drabinka i strona publiczna już to pokazują.`);
  render();
}
function goOnline() {
  const cat = CATS['b14-60'];
  let n = net.pendingFeed.length + sc.log.filter(l => !l.synced).length;
  Object.values(cat.results).forEach(r => r.pub = true);
  net.pendingFeed.reverse().forEach(e => feed.unshift(e)); net.pendingFeed = [];
  sc.log.forEach(l => l.synced = true);
  net.offline = false;
  toast(n ? `Sieć wróciła. Wysłano ${n} zdarzeń z kolejki.` : 'Sieć wróciła.');

    const cat = CATS['g12-45'], ids = [...cat.pool];
    for (let t = 0; t < 800; t++) {
      for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
      const half = ids.length / 2;
      if (ids.every((x, k) => ids.every((y, m) => m <= k || F[x].club !== F[y].club || (k < half) !== (m < half)))) break;
    }
    cat.R1 = []; for (let i = 0; i < ids.length; i += 2) cat.R1.push([ids[i], ids[i + 1]]);
    let no = 71; cat.num = {}; for (let r = 0; r < 3; r++) for (let i = 0; i < 4 / 2 ** r; i++) cat.num[`r${r}-${i}`] = no++;
    cat.drawAnim = true; ui.bmode = 'tree';
    AUDIT.unshift({ tm: hm(simClock) + ':00', who: 'Organizator · Michał S.', what: 'Losowanie: Dziewczęta 12–13 lat −45 kg' });
    render(); setTimeout(() => { cat.drawAnim = false; }, 1600);
    toast('Wylosowano. Kluby rozdzielone na przeciwne połówki.');
  },
  wa: a => { const s = a.dataset.arg; if (sc.winner) return; sc[s].wa++; scLog(s, 'wa', 'Waza-ari'); if (sc[s].wa >= 2) { sc.winner = s; sc.method = 'Ippon'; sc.tech = 'awase waza-ari'; stopTimer(true); scLog(s, 'ippon', 'Awase waza-ari = ippon'); flash('一本', 'IPPON', s); } else flash('技有', 'WAZA-ARI', s); render(); },
  ippon: a => { const s = a.dataset.arg; sc.winner = s; sc.method = 'Ippon'; stopTimer(true); scLog(s, 'ippon', 'Ippon'); flash('一本', 'IPPON', s); render(); },
  chui: a => { const s = a.dataset.arg; if (sc[s].chui >= 4) return; sc[s].chui++; const c = sc[s].chui; scLog(s, 'chui', c === 4 ? 'Hansoku (2 × genten)' : c % 2 ? 'Chui' : 'Genten'); if (c === 4) { sc.winner = s === 'a' ? 'b' : 'a'; sc.method = 'Hansoku'; stopTimer(true); } render(); },
  win: a => { const s = a.dataset.arg; sc.winner = sc.winner === s ? null : s; render(); },
  undo: () => { const l = sc.log.shift(); if (!l) return; if (l.type === 'wa') sc[l.side].wa = Math.max(0, sc[l.side].wa - 1); if (l.type === 'chui') sc[l.side].chui = Math.max(0, sc[l.side].chui - 1); if (['ippon', 'hantei'].includes(l.type)) { sc.winner = null; sc.method = ''; sc.tech = ''; } render(); },
  timer: () => { sc.running ? stopTimer() : startTimer(); render(); },
  reset: () => { stopTimer(true); sc.time = phaseLen(); sc.ended = false; render(); },
  adj: a => { sc.time = Math.max(0, Math.min(phaseLen(), sc.time + +a.dataset.arg)); sc.ended = sc.time <= 0; render(); },
  encho: () => { stopTimer(true); sc.encho++; sc.time = 60; sc.ended = false; sc.hantei = false; sc.votes = [null, null, null, null, null]; scLog(null, 'sys', `Encho ${sc.encho}`); render(); },
  hantei: () => { stopTimer(true); sc.hantei = true; sc.votes = [null, null, null, null, null]; scLog(null, 'sys', 'Wezwanie do hantei'); simulateVotes(); render(); },
  vote: a => { const k = +a.dataset.arg, cyc = [null, 'a', 'b', 'd']; sc.hantei = true; sc.votes[k] = cyc[(cyc.indexOf(sc.votes[k]) + 1) % 4]; afterVote(); render(); },
  tvote: a => { sc.votes[2] = a.dataset.arg; afterVote(); render(); toast('Głos wysłany do sekretarza Tatami 2'); },
  confirm: confirmBout,
  net: a => { if (a.checked) { net.offline = true; toast('Tryb offline: panel działa dalej, zdarzenia czekają w kolejce.'); } else goOnline(); render(); },
  annAuto: a => { annAuto = a.checked; },
  annPlay: a => { if (!speak(ann[+a.dataset.arg].txt)) toast('Ta przeglądarka nie obsługuje syntezy mowy.'); },
  resetDemo: () => location.reload(),
  sbMode: a => { ui.sbMode = a.dataset.arg; render(); },
  org: a => { ui.org = a.dataset.arg; render(); },
  checkin: a => { const r = WEIGH[+a.dataset.arg]; r.in = !r.in; render(); },
  moveUp: a => { const r = WEIGH[+a.dataset.arg]; const old = r.cat; r.cat = r.up[0]; r.max = r.up[1]; delete r.up; AUDIT.unshift({ tm: hm(simClock) + ':00', who: 'Weryfikacja · Kasia M.', what: `${r.n}: ${old} → ${r.cat} (waga ${kg(r.w)})` }); toast(`${r.n} przeniesiony do kategorii ${r.cat}`); render(); },
  merge: a => { const c = ORGCATS.find(x => x.id === a.dataset.arg), t = ORGCATS.find(x => x.id === c.merge); t.name = 'Dziewczęta 12–13 lat −50 / +50 kg (open)'; t.n += c.n; t.st = 'połączona'; ORGCATS = ORGCATS.filter(x => x !== c); AUDIT.unshift({ tm: hm(simClock) + ':00', who: 'Organizator · Michał S.', what: `Połączono kategorie: ${c.name} + Dziewczęta 12–13 lat −50 kg` }); toast('Kategorie połączone. Kluby dostaną powiadomienie.'); render(); },
  split: a => { const i = ORGCATS.findIndex(x => x.id === a.dataset.arg); ORGCATS.splice(i, 1, { id: 'c5a', name: 'Chłopcy 10–11 lat −32 kg', n: 10, disc: 'Kumite', t: 4, st: 'gotowa' }, { id: 'c5b', name: 'Chłopcy 10–11 lat −35 kg', n: 11, disc: 'Kumite', t: 4, st: 'gotowa' }); AUDIT.unshift({ tm: hm(simClock) + ':00', who: 'Organizator · Michał S.', what: 'Podział: Chłopcy 10–11 −35 kg → −32 kg (10) i −35 kg (11)' }); toast('Kategoria podzielona na dwie drabinki.'); render(); },
  gsel: a => { ui.gSel = ui.gSel === a.dataset.arg ? null : a.dataset.arg; render(); },
  gmove: a => { const x = SCHED.find(s => s.id === ui.gSel), t = +a.dataset.arg, from = x.t, dur = x.e - x.s; const last = Math.max(simClock, ...SCHED.filter(s => s.t === t).map(s => s.e)); x.t = t; x.s = Math.max(x.s, last + 5); x.e = x.s + dur; feed.unshift({ tm: hm(simClock), t, txt: `Kategoria ${x.name} przeniesiona z Tatami ${from} na Tatami ${t}`, sys: true, fresh: true }); AUDIT.unshift({ tm: hm(simClock) + ':00', who: 'Organizator · Michał S.', what: `${x.name}: Tatami ${from} → Tatami ${t}` }); toast(`${x.name} na Tatami ${t}, start ok. ${hm(x.s)}. Trenerzy dostaną powiadomienie.`); render(); },
  pick: a => { const i = +a.dataset.arg; a.checked ? ui.clubSel.add(i) : ui.clubSel.delete(i); render(); },
  consent: a => { ui.consents[+a.dataset.arg] = a.checked; render(); },
  submitReg: () => { const c = CLUBCATS[ui.clubCat], n = ui.clubSel.size; ui.clubSel.forEach(i => MEMBERS[i].reg.push(c.id)); ui.clubSel.clear(); toast(`Zgłoszono ${n} ${n === 1 ? 'osobę' : 'osoby'}. Potwierdzenie przyjdzie na e-mail klubu.`); render(); },
  mockOnly: () => toast('W prototypie ta funkcja jest wyłączona.'),
  mockCorr: () => toast('Korektę zatwierdza sędzia główny. Zmiana trafi do historii zmian.'),
};
const CHANGE = {
  method: e => { sc.method = e.value; render(); },
  tech: e => { sc.tech = e.value; },
  follow: e => { ui.follow = e.value; render(); },
  tol: e => { ui.tol = Math.max(0, parseFloat(e.value) || 0); render(); },
  weight: e => { const r = WEIGH[+e.dataset.arg]; const v = parseFloat(String(e.value).replace(',', '.')); r.w = isNaN(v) ? null : v; if (r.w != null) r.in = true; render(); },
  clubCat: e => { ui.clubCat = +e.value; ui.clubSel.clear(); render(); },
  pts: e => { ui.pts[e.dataset.arg] = Math.max(0, parseInt(e.value) || 0); render(); },
};
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const fn = ACT[a.dataset.act]; if (!fn) return;
  if (a.tagName === 'INPUT') { fn(a, e); return; }
  e.preventDefault(); fn(a, e);
});
document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el && CHANGE[el.dataset.change]) CHANGE[el.dataset.change](el); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDrawer();
  if (!['sekretarz', 'ekran'].includes(ui.view) || !liveBout()) return;
  if (e.target.closest('input,select,textarea,button')) return;
  if (e.code === 'Space') { e.preventDefault(); ACT.timer(); }
  if (ui.view === 'sekretarz' && e.key.toLowerCase() === 'q') ACT.wa({ dataset: { arg: 'a' } });
  if (ui.view === 'sekretarz' && e.key.toLowerCase() === 'p') ACT.wa({ dataset: { arg: 'b' } });
});
/* path highlight */
function setHL(host, f) {
  if (host._hl === f) return; host._hl = f;
  $$('.hl', host).forEach(el => el.classList.remove('hl'));
  host.classList.toggle('has-hl', !!f);
  if (f) $$(`[data-f="${f}"]`, host).forEach(el => el.classList.add('hl'));
}
document.addEventListener('mouseover', e => { const host = e.target.closest('.bk'); $$('.bk').forEach(h => { if (h !== host) setHL(h, null); }); if (!host) return; const s = e.target.closest('[data-f]'); setHL(host, s ? s.dataset.f : null); });
document.addEventListener('focusin', e => { const host = e.target.closest('.bk'); if (!host) return; const s = e.target.closest('[data-f]'); setHL(host, s ? s.dataset.f : null); });

/* ===================== render ===================== */
const RENDER = { turniej: viewTurniej, drabinki: viewDrabinki, wyniki: viewWyniki, sledz: viewSledz, sekretarz: viewSekretarz, sedzia: viewSedzia, ekran: viewEkran, organizator: viewOrganizator, klub: viewKlub };
function render() {
  const active = document.activeElement && document.activeElement.id;
  $('#app').innerHTML = RENDER[ui.view]();
  if (active) { const el = document.getElementById(active); if (el && el !== document.body) el.focus({ preventScroll: true }); }
  if (ui.view === 'drabinki' && ui.cat === 'g12-45' && CATS['g12-45'].R1) { const w = $('.bk-wrap'); if (w && !$('.check', w)) w.insertAdjacentHTML('afterbegin', `<div style="padding-top:16px">${drawCheck(CATS['g12-45'])}</div>`); }
  drawQR();
  feed.forEach(f => { if (f.fresh) setTimeout(() => { f.fresh = false; }, 2500); });
}
function route() {
  const h = location.hash.replace('#', '');
  ui.view = RENDER[h] ? h : 'turniej';
  renderNav(); closeDrawer(); render(); window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>
