<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Klikalny mock systemu zarządzania turniejem karate zgodny ze specyfikacją wymagań REQ: strefa publiczna, panel organizatora i klubu, panel sędziego tatami.">
<title>Hajime – mock wg specyfikacji</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@500;700&family=Noto+Serif+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
/* Mock wg specyfikacji REQ: trzy strefy (/, /admin, /referee) w jednym pliku, stan wspólny dla kart przeglądarki
   (BroadcastChannel udaje WebSocket). Wygląd z rodziny Hajime: indygo + aka/shiro jako jedyna głośna para. */
:root{
  --paper:#eef0f6; --surface:#ffffff; --surface-2:#f6f7fc; --surface-3:#e6e9f3;
  --ink:#0f1330; --ink-2:#2f3557; --ink-3:#4f5572; --line:#d3d7e6; --line-2:#868cab;
  --ai:#2a37a8; --ai-ink:#ffffff; --ai-soft:#e3e7fb;
  --aka:#b8142f; --aka-t:#b8142f; --aka-ink:#ffffff; --aka-soft:#fde4e8;
  --go:#ffd23f; --go-ink:#0f1330;
  --shiro:#ffffff; --shiro-ink:#14183a; --shiro-edge:#bfc4db;
  --gold:#c4951a; --silver:#8b95ab; --bronze:#c47a48;
  --ok:#0a6440; --ok-soft:#dcf2e7; --warn:#6e4600; --warn-soft:#fbe9c0; --bad:#a51616; --bad-soft:#fde3e3;
  --hero-bg:#1a2370; --hero-ink:#ffffff; --hero-dim:#aab3ee;
  --shadow:0 1px 2px rgba(20,24,58,.06),0 10px 28px -14px rgba(20,24,58,.22);
  --f-display:'Archivo','Arial Narrow',system-ui,sans-serif;
  --f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --f-jp:'Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0b0e22; --surface:#141834; --surface-2:#1a1f40; --surface-3:#21274d;
  --ink:#f3f4fd; --ink-2:#c9cdea; --ink-3:#a3a9cf; --line:#2c3360; --line-2:#59619a;
  --ai:#8d9cff; --ai-ink:#0b0e22; --ai-soft:#222a5e;
  --aka:#d81e3a; --aka-t:#ff7d8f; --aka-ink:#ffffff; --aka-soft:#3b1526;
  --go:#ffd23f; --go-ink:#0f1330;
  --shiro:#eceefb; --shiro-ink:#0b0e22; --shiro-edge:#eceefb;
  --gold:#e5b843; --silver:#aab3c8; --bronze:#d48a55;
  --ok:#3ccf8e; --ok-soft:#11352a; --warn:#f0b53a; --warn-soft:#3a2d10; --bad:#ff6a6a; --bad-soft:#3d1717;
  --hero-bg:#1a2058; --hero-ink:#ffffff; --hero-dim:#9aa4e6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0b0e22; --surface:#141834; --surface-2:#1a1f40; --surface-3:#21274d;
  --ink:#f3f4fd; --ink-2:#c9cdea; --ink-3:#a3a9cf; --line:#2c3360; --line-2:#59619a;
  --ai:#8d9cff; --ai-ink:#0b0e22; --ai-soft:#222a5e;
  --aka:#d81e3a; --aka-t:#ff7d8f; --aka-ink:#ffffff; --aka-soft:#3b1526;
  --go:#ffd23f; --go-ink:#0f1330;
  --shiro:#eceefb; --shiro-ink:#0b0e22; --shiro-edge:#eceefb;
  --gold:#e5b843; --silver:#aab3c8; --bronze:#d48a55;
  --ok:#3ccf8e; --ok-soft:#11352a; --warn:#f0b53a; --warn-soft:#3a2d10; --bad:#ff6a6a; --bad-soft:#3d1717;
  --hero-bg:#1a2058; --hero-ink:#ffffff; --hero-dim:#9aa4e6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
a{color:var(--ai)}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1360px;margin:0 auto;padding:8px 20px;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:none}
.hanko{width:34px;height:34px;border-radius:7px;background:var(--aka);color:var(--aka-ink);display:grid;place-items:center;font:900 20px/1 var(--f-jp);transform:rotate(-4deg);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--aka-ink) 35%,transparent);flex:none}
.brand b{font:900 19px/1 var(--f-display);font-stretch:118%;letter-spacing:.01em}
.brand small{display:block;font:500 10.5px/1.2 var(--f-mono);color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.zones{display:flex;gap:2px;background:var(--surface-3);border-radius:12px;padding:3px}
.zones a{display:flex;flex-direction:column;padding:5px 13px;border-radius:9px;text-decoration:none;color:var(--ink-2);font-weight:650;font-size:13.5px;line-height:1.2;white-space:nowrap}
.zones a small{font:500 10px/1.2 var(--f-mono);color:var(--ink-3)}
.zones a.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.zones a:not(.on):hover{color:var(--ink)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}
.chipbtn{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 11px;font:600 12px/1 var(--f-mono);color:var(--ink-2);white-space:nowrap}
.chipbtn[aria-pressed="true"]{background:var(--ai);border-color:var(--ai);color:var(--ai-ink)}
.live-ind{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--f-mono);color:var(--ok);white-space:nowrap}
.live-ind i{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.live-ind.ping i{animation:ping .9s ease-out}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 70%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
.subnav{max-width:1360px;margin:0 auto;padding:0 20px 8px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.subnav:empty{display:none}
.subnav a{padding:6px 11px;border-radius:999px;text-decoration:none;color:var(--ink-2);font-weight:600;font-size:13.5px;white-space:nowrap}
.subnav a:hover{background:var(--surface-3);color:var(--ink)}
.subnav a.on{background:var(--ink);color:var(--paper)}
.user-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:3px 4px 3px 3px;font-size:13px;line-height:1.15}
.user-chip small{display:block;font:500 10.5px var(--f-mono);color:var(--ink-3)}
.user-chip button{border:0;background:var(--surface-3);border-radius:999px;padding:6px 10px;font:600 11.5px var(--f-mono);color:var(--ink-2)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--ai);color:var(--ai-ink);display:grid;place-items:center;font:700 11px var(--f-mono);flex:none}
.avatar.club{background:var(--c)}
.avatar.ref{background:var(--ink);color:var(--paper)}
.avatar.ghost{background:var(--surface-3);color:var(--ink-3)}

main{max-width:1360px;margin:0 auto;padding:22px 20px 60px}
.req{display:none;font:600 10px/1 var(--f-mono);color:var(--ai);background:var(--ai-soft);border:1px dashed var(--ai);padding:3px 6px;border-radius:5px;vertical-align:middle;margin-left:6px;white-space:nowrap;letter-spacing:.02em;font-stretch:100%}
body.reqs .req{display:inline-block}
.eyebrow{font:600 12px/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.card h3{font-size:15px;font-stretch:105%;font-weight:800;display:flex;align-items:center;gap:4px 8px;flex-wrap:wrap}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font:700 12px/1.4 var(--f-mono);background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.live{background:var(--aka-soft);color:var(--aka-t)} .pill.ai{background:var(--ai-soft);color:var(--ai)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.live .dot,.live-pill i{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;justify-content:center;text-decoration:none;color:var(--ink);line-height:1.2}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--ai);border-color:var(--ai);color:var(--ai-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.danger{color:var(--bad)}
.btn.danger-solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.big{width:100%;padding:15px;font-size:16px;border-radius:14px;min-height:56px;font-family:var(--f-display);font-weight:800;font-stretch:105%}
.btn .req{margin-left:2px}
.lnk{border:0;background:none;padding:0;color:var(--ai);font:inherit;text-decoration:underline}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface-3);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.club-dot{width:10px;height:10px;border-radius:3px;background:var(--c);display:inline-block;flex:none}
.belt{display:inline-block;width:22px;height:7px;border-radius:2px;background:var(--b);position:relative;vertical-align:middle;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.belt.st::after{content:"";position:absolute;right:3px;top:0;bottom:0;width:4px;background:var(--s)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font:700 11.5px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t .c{text-align:center}
table.t .r{text-align:right}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;font-size:12.5px;color:var(--ink-2);font-weight:600;min-width:0}
.field select,.field input,.inp{border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:9px 10px;font-size:15px;font-weight:500;color:var(--ink);width:100%;min-width:0}
.field input:disabled{opacity:.5}
.field.inline{flex-direction:row;align-items:center;margin:0;max-width:100%}
.field.inline select{width:auto;max-width:100%}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none;font-weight:600}
.switch input{appearance:none;width:34px;height:20px;border-radius:99px;background:var(--line-2);position:relative;margin:0;cursor:pointer;transition:background .15s;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch input:checked{background:var(--ai)}
.switch input:checked::after{transform:translateX(14px)}
.note{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink-2)}
.note b{color:var(--ink)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.banner{display:flex;gap:10px;align-items:center;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:11px 14px;font-weight:600;font-size:14px;margin-bottom:14px}
.banner.info{background:var(--ai-soft);color:var(--ai)}
.sub-h{font:700 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:16px 0 8px}
.empty{color:var(--ink-3);text-align:center;padding:30px 16px}
.err{color:var(--bad);font-size:13px;font-weight:600;min-height:1em;margin-bottom:6px}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.tog{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line-2);border-radius:10px;padding:9px 12px;font-weight:600;font-size:13.5px;background:var(--surface);color:var(--ink-2)}
.tog::before{content:"";width:14px;height:14px;border-radius:4px;border:2px solid var(--line-2);flex:none}
.tog.on{border-color:var(--ai);background:var(--ai-soft);color:var(--ink)}
.tog.on::before{background:var(--ai);border-color:var(--ai);box-shadow:inset 0 0 0 2px var(--ai-soft)}
.tog small{font-weight:500;color:var(--ink-3)}

.page-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 20px;margin-bottom:18px}
.page-h>div{min-width:0;max-width:100%}
.page-h h1{font-size:clamp(24px,3.2vw,34px);font-weight:900;font-stretch:112%;margin-top:4px}
.page-h p{margin:8px 0 0;color:var(--ink-2);max-width:760px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- public ---------- */
.hero{position:relative;overflow:hidden;background:var(--hero-bg);color:var(--hero-ink);border-radius:20px;padding:30px 30px 26px;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(90deg,transparent 0 118px,rgba(255,255,255,.05) 118px 120px),repeating-linear-gradient(0deg,transparent 0 58px,rgba(255,255,255,.035) 58px 60px)}
.hero-kanji{position:absolute;right:22px;top:-6px;z-index:-1;font:900 150px/1 var(--f-jp);writing-mode:vertical-rl;color:rgba(255,255,255,.07)}
.hero-eyebrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font:600 12px/1.4 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--hero-dim)}
.hero .req{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.4)}
.live-pill{display:inline-flex;align-items:center;gap:7px;background:var(--aka);color:#fff;border-radius:999px;padding:4px 10px}
.live-pill i{width:7px;height:7px;border-radius:50%;background:#fff}
.hero-title{font-size:clamp(36px,6vw,72px);font-weight:900;font-stretch:122%;letter-spacing:-.01em;margin:14px 0 18px;line-height:.95}
.hero-stats{display:flex;flex-wrap:wrap;gap:12px 30px;align-items:flex-end}
.hs b{display:block;font:800 26px/1 var(--f-display);font-stretch:110%}
.hs span{font:500 11px/1.3 var(--f-mono);color:var(--hero-dim);text-transform:uppercase;letter-spacing:.08em}
.hs-prog{flex:1;min-width:200px;max-width:360px}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#fff,var(--hero-dim));border-radius:9px;transition:width .4s}
.home-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:16px}
.tile{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-decoration:none;color:var(--ink)}
.tile:hover{border-color:var(--ink-3)}
.tile b{font:800 17px/1.15 var(--f-display);font-stretch:105%}
.tile span{font-size:13.5px;color:var(--ink-2)}
.feed{display:flex;flex-direction:column}
.feed-i{display:grid;grid-template-columns:46px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.feed-i:first-child{border-top:0}
.feed-i .tm{font:600 12px/1.5 var(--f-mono);color:var(--ink-3)}
.feed-i.k-medal{background:color-mix(in srgb,var(--gold) 9%,transparent)}
.feed-i.k-fix{color:var(--warn)}
.mats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mat{background:var(--surface);border:2px solid var(--line-2);border-radius:16px;padding:0 14px 14px;display:flex;flex-direction:column;gap:11px;min-width:0;overflow:hidden}
.mat.is-live{border-color:var(--aka)}
.mat-h{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--ink);color:var(--paper);margin:0 -14px;padding:10px 14px}
.mat.is-live .mat-h{background:var(--aka);color:#fff}
.mat-n,.mat-no{display:flex;flex-direction:column;line-height:1;gap:3px}
.mat-n small,.mat-no small{font:700 11.5px var(--f-mono);letter-spacing:.12em}
.mat-n b,.mat-no b{font:900 38px/1 var(--f-display);font-stretch:112%;font-variant-numeric:tabular-nums}
.mat-no{align-items:flex-end;text-align:right}
.mat-cat{font-size:14.5px;color:var(--ink-2);font-weight:700}
.mat-idle{background:var(--surface-2);border-radius:10px;padding:16px 12px;text-align:center;color:var(--ink);font-weight:700;font-size:16px}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:stretch;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.vs>div{padding:10px;min-width:0}
.vs .a{background:var(--aka);color:var(--aka-ink)}
.vs .b{background:var(--shiro);color:var(--shiro-ink);text-align:right}
.vs .mid{background:var(--surface-2);display:grid;place-items:center;padding:0 10px;font:700 15px/1 var(--f-mono)}
.vs b{display:block;font:800 17px/1.15 var(--f-display);font-stretch:85%;overflow-wrap:anywhere}
.vs small{font-size:12.5px;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.pts{display:flex;gap:8px;align-items:center;margin-top:6px;font:600 10px var(--f-mono);letter-spacing:.06em}
.vs .b .pts{justify-content:flex-end}
.wa-pips{display:inline-flex;gap:3px}
.wa-pips i{width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor;opacity:.6}
.wa-pips i.on{background:currentColor;opacity:1}
.pen-mini{display:inline-flex;gap:2px}
.pen-mini i{width:6px;height:9px;border-radius:2px;border:1.5px solid currentColor;opacity:.45}
.pen-mini i.on{background:currentColor;opacity:1}
.kata-live{background:var(--ai-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.kata-live b{font:800 18px/1.15 var(--f-display);font-stretch:90%}
.next-list{display:flex;flex-direction:column;gap:3px;font-size:15px;color:var(--ink)}
.next-list>div{display:flex;gap:10px;padding:4px 6px;border-radius:8px}
.next-list>div.nx{background:var(--go);color:var(--go-ink);font-weight:700}
.next-list>div.nx .muted{color:var(--go-ink)}
.next-list .mono{color:inherit;font-size:15px;font-weight:800;flex:none;width:42px}
.next-list span:last-child{min-width:0;overflow-wrap:anywhere}
.mbar{height:4px;background:var(--surface-3);border-radius:9px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--ai);transition:width .4s}
.mat-f{display:flex;justify-content:space-between;font:600 12px var(--f-mono);color:var(--ink-3)}
.filterbar{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:0 12px;align-items:end}
.count{font:600 12px var(--f-mono);margin:0 0 8px}
.plist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.p-row{display:grid;grid-template-columns:10px minmax(0,1.3fr) minmax(0,1.2fr) 120px auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.p-row:first-child{border-top:0}
.p-row b{font-weight:650}
.p-row small{display:block;font-size:12.5px;color:var(--ink-3)}
.p-g{font-size:13px;color:var(--ink-2);white-space:nowrap}

/* ---------- brackets ---------- */
.bk-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
.bk-layout>*{min-width:0}
.cat-list{display:flex;flex-direction:column;gap:6px;position:sticky;top:130px;max-height:calc(100vh - 150px);overflow:auto;scrollbar-width:thin}
.cat-btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink)}
.cat-btn:hover{border-color:var(--ink-3)}
.cat-btn.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cat-btn b{font:800 14px/1.2 var(--f-display);font-stretch:92%}
.cat-btn .row{display:flex;justify-content:space-between;gap:6px;align-items:center;font-size:12px;color:var(--ink-3)}
.cat-sel{display:none}
.bk-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;align-items:flex-end;margin-bottom:12px}
.bk-head h2{font-size:clamp(22px,2.8vw,32px);font-weight:900;font-stretch:110%;margin-top:4px}
.meta-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2);margin:6px 0 12px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.bk-wrap{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:auto;-webkit-overflow-scrolling:touch}
.bk{position:relative;margin:22px 22px 22px}
.bk svg.cn-layer{position:absolute;inset:0;overflow:visible;pointer-events:none}
.cn{fill:none;stroke:var(--line-2);stroke-width:1.5}
.cn.done{stroke:var(--ink-3);stroke-width:2}
.cn.pend{stroke-dasharray:3 4}
.r-head{position:absolute;top:0;font:700 11.5px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.bout{position:absolute}
.bout-tag{position:absolute;left:0;right:0;top:-18px;height:16px;display:flex;justify-content:space-between;align-items:center;padding:0 2px;font:600 11.5px/1 var(--f-mono);color:var(--ink-3);letter-spacing:.02em;white-space:nowrap}
.bout-box{border:1px solid var(--line-2);border-radius:9px;background:var(--surface);overflow:hidden}
.slot{display:grid;grid-template-columns:4px minmax(0,1fr) auto;align-items:center;gap:8px;height:30px;width:100%;border:0;background:none;text-align:left;padding:0 9px 0 0;color:var(--ink);font:inherit}
.slot+.slot{border-top:1px solid var(--line)}
.slot>i{align-self:stretch;background:var(--c,transparent)}
.slot .nm{font:650 13.5px/1 var(--f-display);font-stretch:84%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .cl{font:600 10.5px/1 var(--f-mono);color:var(--ink-3);letter-spacing:.04em;margin-left:6px;font-stretch:100%}
.slot .rs{font:700 10px/1 var(--f-mono);text-align:right;color:var(--ink-3)}
.slot.win{background:var(--surface-2)}
.slot.win .nm{font-weight:850}
.slot.win .rs{color:var(--ok)}
.slot.lose .nm{color:var(--ink-3);font-weight:500}
.slot.ph .nm{color:var(--ink-3);font-weight:500;font-style:italic;font-family:var(--f-body);font-size:12px}
.slot.bye .nm{font-style:normal;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
button.slot{cursor:pointer}
button.slot:hover{background:var(--ai-soft)}
.slot.sel{background:var(--ai)!important;color:var(--ai-ink)}
.slot.sel .nm,.slot.sel .cl{color:var(--ai-ink)!important}
.slot.conf{box-shadow:inset 0 0 0 2px var(--bad)}
.bout.s-live .bout-box{border-color:var(--aka);box-shadow:0 0 0 3px var(--aka-soft)}
.bout.s-live .bout-tag .m{color:var(--aka-t)}
.bout.s-ready .bout-tag .m{color:var(--ai)}
.bout.s-bye .bout-box{border-style:dashed;box-shadow:none}
.bout.s-bye .slot.ph{opacity:.7}
.bronze-lbl{position:absolute;font:600 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--bronze)}
.rlist{display:none;flex-direction:column;gap:14px}
.rl-r h4{font:600 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.rl-b{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;margin-bottom:8px}
.rl-b .bt-h{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;font:600 12px var(--f-mono);color:var(--ink-3);background:var(--surface-2);border-bottom:1px solid var(--line)}
.rl-b .slot{height:44px}
.rl-b .slot .nm{font-size:16px}
.rl-b.s-live{border-color:var(--aka)}
.rl-b.s-live .bt-h{color:var(--aka-t);background:var(--aka-soft)}
.rl-b.s-bye{border-style:dashed}
.rl-byes{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;border:1px dashed var(--line-2);border-radius:12px;padding:10px 12px;font-size:13.5px}
.rl-byes .eyebrow{flex-basis:100%}
.rl-bye{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.podium{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.pod{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
td .medal{margin:0 auto}
.medal{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:800 13px var(--f-mono);color:#0f1330;flex:none;background:var(--m)}
.pod b{display:block;font:800 14px/1.2 var(--f-display);font-stretch:88%}
.pod small{color:var(--ink-3);font-size:12px}
.rr-t td.cell{text-align:center;font:700 12px var(--f-mono);width:56px}
.rr-t td.cell small{display:block;font-size:9.5px;font-weight:500;color:var(--ink-3)}
.rr-t td.self{background:repeating-linear-gradient(45deg,var(--surface-3) 0 4px,transparent 4px 8px)}
.rr-t td.W{color:var(--ok)} .rr-t td.L{color:var(--ink-3)}
.rank-t .tot{font:800 16px var(--f-display);font-variant-numeric:tabular-nums;text-align:right}
.rank-t tr.cut td{border-bottom:2px dashed var(--ok)}
.rank-t tr.cur{background:var(--aka-soft)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.sc-chip{font:700 13px var(--f-mono);padding:3px 7px;border-radius:7px;background:var(--surface);border:1px solid var(--line)}
.sc-chip.x{text-decoration:line-through;color:var(--ink-3);background:transparent;border-style:dashed}
.edit-bar{display:flex;gap:10px;align-items:center;background:var(--ai-soft);color:var(--ink);border-radius:12px;padding:11px 14px;font-size:14px;margin-bottom:12px;flex-wrap:wrap}
.edit-bar b{color:var(--ai)}
.chk-list{display:flex;flex-direction:column;gap:8px}
.chk{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:13.5px;align-items:start}
.chk>span:first-child{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:800 12px var(--f-mono);color:#fff;background:var(--ok)}
.chk.warn>span:first-child{background:var(--warn)}
.chk.bad>span:first-child{background:var(--bad)}
.chk small{display:block;color:var(--ink-3);font-size:12.5px}
.br-grid{display:flex;flex-direction:column;gap:14px}
.br-aside{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:12px 20px;align-items:end}
.br-aside .chk-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px 16px}
.order-list{display:flex;flex-direction:column;gap:6px}
.order-list .slot{border:1px solid var(--line);border-radius:10px;height:42px;background:var(--surface)}
.order-list .slot .nm{font-size:15px}
.gen-box{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.gen-box ul{margin:0;padding-left:18px;color:var(--ink-2);font-size:14px}

/* ---------- admin ---------- */
.tour-list{display:flex;flex-direction:column;gap:10px}
.tour{display:grid;grid-template-columns:minmax(0,1fr) 90px 90px auto;gap:14px;align-items:center}
.tour.cur{border-color:var(--ai);box-shadow:inset 3px 0 0 var(--ai)}
.tour h3{font-size:18px;margin:6px 0 2px}
.tour-kpi b{display:block;font:800 22px/1 var(--f-display)}
.tour-kpi span{font-size:12px;color:var(--ink-3)}
.adm-ctx{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:-6px 0 16px;font-size:13.5px;color:var(--ink-2)}
.adm-ctx select{border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:6px 8px;font-weight:600;max-width:100%;min-width:0}
.cat-t{min-width:820px}
.cat-t td b{font-family:var(--f-display);font-stretch:92%}
.cat-t td small{display:block;color:var(--ink-3);font-size:12px}
.cat-t .acts{flex-wrap:nowrap}
.two-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.e-row{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.e-row:first-of-type{border-top:0}
.e-row small{display:block;font-size:12px;color:var(--ink-3)}
.eb{display:inline-flex;gap:3px;flex-wrap:wrap}
.eb span{font:600 10px var(--f-mono);padding:2px 5px;border-radius:5px;background:var(--ok-soft);color:var(--ok)}
.eb span.no{background:var(--bad-soft);color:var(--bad)}
.x-btn{border:0;background:var(--surface-3);border-radius:8px;width:30px;height:30px;font-size:16px;line-height:1;color:var(--ink-2)}
.x-btn:hover{background:var(--bad-soft);color:var(--bad)}
.x-btn:disabled{opacity:.3;cursor:not-allowed}
.sched{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.sch-col h3{font:900 18px var(--f-display);font-stretch:118%;margin-bottom:10px}
.sch-c{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px}
.sch-c b{font:800 14px/1.2 var(--f-display);font-stretch:92%}
.sch-c .row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3);flex-wrap:wrap}
.sch-c .tm{font:700 12px var(--f-mono);color:var(--ink-2)}
.sch-c select{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:4px 6px;font-size:12.5px}
.sch-c .mv{display:flex;gap:4px}
.medals td.m{font:700 15px var(--f-mono);text-align:center}
.medals td.rk{font:800 14px var(--f-mono);color:var(--ink-3);width:44px}
.medals th.g{color:var(--gold)} .medals th.s{color:var(--silver)} .medals th.b{color:var(--bronze)}
.medals tr.lead td{background:color-mix(in srgb,var(--gold) 8%,transparent)}
.team-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.rules-l{margin:8px 0 0;padding-left:20px;font-size:14px;color:var(--ink-2)}
.rules-l li{margin-bottom:4px}

/* ---------- club ---------- */
.sum-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.ath-list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ath{display:grid;grid-template-columns:minmax(0,1fr) 110px 90px auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.ath:first-child{border-top:0}
.ath b{font-weight:650}
.ath small{display:block;font-size:12.5px;color:var(--ink-3)}
.ath-g{font-size:13px;white-space:nowrap}
.reg-list{display:flex;flex-direction:column;gap:10px}
.reg{display:grid;grid-template-columns:220px minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.reg b{font-weight:650}
.reg small{display:block;font-size:12.5px;color:var(--ink-3)}
.reg-c{display:flex;flex-wrap:wrap;gap:6px}
.regchip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--ink-2);min-height:40px;text-align:left}
.regchip.on{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.regchip:disabled{opacity:.55;cursor:not-allowed}

/* ---------- login ---------- */
.login{max-width:980px;margin:10px auto;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.login .hanko{width:50px;height:50px;font-size:27px;border-radius:12px}
.login h1{font-size:clamp(28px,4vw,40px);font-weight:900;font-stretch:112%}
.acc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;width:100%;margin-top:8px}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.acc.hl{border-color:var(--ai);box-shadow:0 0 0 3px var(--ai-soft)}
.acc.ghost{background:transparent;border-style:dashed}
.acc-i{display:flex;gap:10px;align-items:center}
.acc-i b{display:block;font:800 16px/1.15 var(--f-display)}
.acc-i small{font-size:12.5px;color:var(--ink-3)}
.acc p{margin:0;font-size:13.5px;color:var(--ink-2);flex:1}
.acc .field{margin:0}
.gate{max-width:560px;margin:40px auto;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.gate .acts{justify-content:center}

/* ---------- referee ---------- */
.pick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.pick{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;color:var(--ink);min-height:120px}
.pick:hover{border-color:var(--ink)}
.pick-n{width:64px;height:64px;border-radius:10px;background:repeating-linear-gradient(90deg,#c9bf86 0 16px,#b4aa71 16px 32px);box-shadow:inset 0 0 0 4px var(--aka),inset 0 0 0 7px #c9bf86;display:grid;place-items:center;font:900 26px var(--f-display);color:#2b2a1a}
.pick-b b{display:block;font:800 19px var(--f-display);font-stretch:110%}
.pick-b small{display:block;font-size:13px;color:var(--ink-2);margin-top:2px}
.pick-b .pill{margin-top:6px}
.ref-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:14px}
.ref-head h1{font:900 clamp(30px,4vw,42px)/1 var(--f-display);font-stretch:118%;margin-top:4px}
.ref-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.ref-main{display:flex;flex-direction:column;gap:12px;min-width:0}
.match-h{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.match-h h2{font:900 26px/1.1 var(--f-display);font-stretch:110%;margin-top:4px}
.match-h h2 span{font-stretch:85%;font-weight:600;color:var(--ink-2);font-size:18px}
.lock-note{font-size:12.5px;color:var(--ink-3);display:flex;gap:6px;align-items:center}
.corners{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.corner{border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;min-width:0}
.corner.aka{background:var(--aka);color:var(--aka-ink)}
.corner.shiro{background:var(--shiro);color:var(--shiro-ink);border:2px solid var(--shiro-edge)}
.corner .kj{position:absolute;right:12px;top:4px;font:900 80px/1 var(--f-jp);opacity:.12;pointer-events:none}
.corner .side{font:700 11px var(--f-mono);letter-spacing:.16em;opacity:.85}
.corner .fname{font:900 clamp(20px,2.4vw,28px)/1.05 var(--f-display);font-stretch:90%}
.corner .fmeta{font-size:13px;opacity:.85}
.corner.won{outline:4px solid var(--gold);outline-offset:-4px}
.score-row{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.score-row .lbl{font:700 10px var(--f-mono);letter-spacing:.12em;opacity:.8;margin-bottom:6px}
.wa-big{display:flex;gap:8px}
.wa-big i{width:32px;height:32px;border-radius:50%;border:3px solid currentColor;opacity:.4}
.wa-big i.on{background:currentColor;opacity:1}
.chui{display:flex;gap:5px}
.chui i{width:14px;height:22px;border-radius:4px;border:2px solid currentColor;opacity:.4}
.chui i.on{background:currentColor;opacity:1}
.ip-badge{font:900 15px var(--f-display);letter-spacing:.1em;border:2px solid currentColor;border-radius:8px;padding:5px 9px}
.corner-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cbtn{border:0;border-radius:12px;padding:12px 8px;font:800 15px/1.1 var(--f-display);font-stretch:95%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px}
.cbtn small{font:500 10px var(--f-mono);opacity:.75;letter-spacing:.06em}
.aka .cbtn{background:rgba(255,255,255,.16);color:inherit}
.aka .cbtn:hover{background:rgba(255,255,255,.26)}
.aka .cbtn.main{background:#fff;color:var(--aka)}
.shiro .cbtn{background:rgba(12,15,36,.07);color:var(--shiro-ink)}
.shiro .cbtn:hover{background:rgba(12,15,36,.13)}
.shiro .cbtn.main{background:var(--shiro-ink);color:var(--shiro)}
.cbtn:active{transform:scale(.97)}
.win-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.win-pick button{border:2px solid var(--line-2);border-radius:12px;padding:10px 12px;font-weight:700;background:var(--surface);text-align:left;min-width:0;min-height:58px}
.win-pick button small{display:block;font:600 10px var(--f-mono);letter-spacing:.12em;color:var(--ink-3)}
.win-pick button span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-display);font-stretch:88%;font-size:15px}
.win-pick button.a.on{border-color:var(--aka);background:var(--aka-soft)}
.win-pick button.b.on{border-color:var(--ink);background:var(--surface-3)}
.methods{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.methods button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:9px 15px;font-weight:650;min-height:44px}
.methods button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.decide p{margin:10px 0 0}
.next-up{display:flex;flex-direction:column;gap:12px}
.nu-no{font:900 44px/1 var(--f-display);font-stretch:115%}
.nu-vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}
.nu-vs span{font:800 19px/1.15 var(--f-display);font-stretch:88%;padding:12px;border-radius:12px;min-width:0;overflow-wrap:anywhere}
.nu-vs .a{background:var(--aka);color:#fff}
.nu-vs .b{background:var(--shiro);color:var(--shiro-ink);border:2px solid var(--shiro-edge);text-align:right}
.nu-vs .v{font:700 13px var(--f-mono);color:var(--ink-3);padding:0}
.nu-k{font:800 22px var(--f-display);background:var(--ai-soft);border-radius:12px;padding:12px}
.done-box{text-align:center;padding:30px 20px}
.big-k{font:900 54px/1 var(--f-jp);color:var(--aka);margin-bottom:8px}
.ref-q{position:sticky;top:130px}
.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;position:relative;max-height:calc(100vh - 230px);overflow:auto;scrollbar-width:thin}
.q-i{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 6px;border-top:1px solid var(--line)}

<script>
/* ===================== utils ===================== */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rq = (...ids) => ids.length ? `<span class="req">${ids.join(' · ')}</span>` : '';
const pad = n => String(n).padStart(2, '0');
const hhmm = (d = new Date()) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fmtMin = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const kg = x => x == null || x === '' ? '—' : (+x).toFixed(1).replace('.', ',') + ' kg';
const fmt1 = v => (+v).toFixed(1).replace('.', ',');
const pl = (n, one, few, many) => { const a = Math.abs(n) % 100, b = a % 10; return `${n} ${n === 1 ? one : b >= 2 && b <= 4 && (a < 12 || a > 14) ? few : many}`; };
const MONTHS = ['stycznia', 'lutego', 'marca', 'kwietnia', 'maja', 'czerwca', 'lipca', 'sierpnia', 'września', 'października', 'listopada', 'grudnia'];
const fmtDate = s => { if (!s) return '—'; const [y, m, d] = s.split('-').map(Number); return `${d} ${MONTHS[m - 1]} ${y}`; };
const fmtDob = s => s ? s.split('-').reverse().join('.') : '—';
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 3000); }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const pickR = (arr, R = Math.random) => arr[Math.floor(R() * arr.length)];

  const mkCat = (d, t) => ({ id: d.id, t, type: d.type, sex: d.sex, age: d.age, w: d.w, g: d.g, tatami: d.tatami, ord: ++ord[d.tatami], bronze: !!d.bronze, odd: d.odd || 'bye', adv: d.adv || 4, entries: [], br: null, res: {}, doneAt: null });

  const clock = { 1: 540, 2: 560, 3: 545 };
  TABS.forEach(t => {

/* symulacja: prowadzi walki na tatami bez sędziego, żeby LIVE i widok klubu żyły */
function simTick() {

  if (Date.now() - (S.simAt || 0) < SIM_MS) return;
  S.simAt = Date.now();
  /* po końcu turnieju demo po minucie zaczyna się od nowa, żeby link zawsze pokazywał trwające zawody */
  qCache = null;
  if (TABS.every(t => !S.mats[t].active && Q(t).every(i => i.res))) {
    S.doneSince = S.doneSince || Date.now();
    if (Date.now() - S.doneSince > 60000) { seed(); save(); commit({ sim: true }); toast('Turniej się skończył — demo zaczyna się od nowa'); return; }
  } else S.doneSince = null;
  TABS.forEach(t => {
    if (refClaim(t)) return;
    qCache = null;
    const m = S.mats[t], q = Q(t);
    if (m.active) {
      const it = q.find(i => i.key === m.active);
      if (!it || it.res) { m.active = null; m.live = null; return; }
      m.ticks = (m.ticks || 0) + 1;
      if (it.kind === 'kumite' && m.ticks <= 2 && Math.random() < .5) {
        const s = Math.random() < .5 ? 0 : 1;
        if (m.live.wa[s] < 1) m.live.wa[s] = 1; else m.live.pen[1 - s] = Math.min(3, m.live.pen[1 - s] + 1);
        return;
      }
      if (it.kind === 'team') {
        const k = m.live.sub.indexOf(null);
        if (k >= 0 && m.ticks <= 3) { m.live.sub[k] = Math.random() < .5 ? 'a' : 'b'; const wa = m.live.sub.filter(x => x === 'a').length, wb = m.live.sub.filter(x => x === 'b').length; if (wa < 2 && wb < 2) return; }
      }
      if (m.ticks >= (it.kind === 'kumite' ? 3 : 2)) applyResult(t, it, autoRes(it, m.live));
    } else {
      const nx = q.find(i => i.status === 'ready');
      if (nx) activate(t, nx.key);
    }
  });
  commit({ sim: true });
}

  return `<div class="rlist">${T.rounds.map((row, r) => {
    const list = row.filter(bt => !bt.bye || mode === 'edit');
    const byes = mode === 'edit' || hide ? [] : row.filter(bt => bt.bye && bt.win && bt.win !== 'BYE');
    if (r === T.R - 1 && T.b3) list.unshift(T.b3);
    return list.length || byes.length ? `<section class="rl-r"><h4>${r === T.R - 1 && T.b3 ? 'Walka o 3. miejsce i finał' : roundName(r, T.R, c)}</h4>${list.map(bt => { const { no, st, lab } = boutState(c, bt, mode); return `<div class="rl-b s-${st}"><div class="bt-h"><span>${bt.bronze ? 'O 3. miejsce' : ''}${bt.bronze && no ? ' · ' : ''}${no ? `walka ${no}` : ''}</span><span>${lab}</span></div>${slotHTML(c, bt, 'a', mode)}${slotHTML(c, bt, 'b', mode)}</div>`; }).join('')}${byes.length ? `<div class="rl-byes"><span class="eyebrow">Wolny los · przechodzą dalej bez walki</span>${byes.map(bt => { const e = ent(bt.win); return `<span class="rl-bye"><span class="club-dot" style="--c:${club(e.club).c}"></span>${esc(e.name)}</span>`; }).join('')}</div>` : ''}</section>` : '';
  }).join('')}</div>`;
}
function rrHTML(c) {
  const o = c.br.order, P = rrPairs(c), st = rrStand(c), done = P.every((_, k) => c.res[`rr-${k}`]);
  const sx = Object.fromEntries(st.map((s, i) => [s.id, { ...s, place: i + 1 }]));
  const cell = (x, y) => {
    if (x === y) return '<td class="self"></td>';
    const k = P.findIndex(p => (p[0] === x && p[1] === y) || (p[0] === y && p[1] === x)), r = c.res[`rr-${k}`];
    if (!r) { const no = noOf(c, `rr-${k}`); return `<td class="cell muted">${no || '·'}</td>`; }
    const win = r.w === 'a' ? P[k][0] : P[k][1];
    return `<td class="cell ${win === x ? 'W' : 'L'}">${win === x ? 'W' : 'P'}<small>${MSHORT[r.m] || ''}</small></td>`;
  };
  return `<div class="note" style="margin-bottom:12px">Mniej niż 4 zawodników, więc kategoria idzie systemem <b>każdy z każdym</b>. Wygrana = 2 pkt; przy równej liczbie punktów decyduje bezpośredni pojedynek, potem liczba waza-ari. ${rq('REQ-ALG-01')}</div>
  <section class="card"><div class="scroll-x"><table class="t rr-t"><thead><tr><th>#</th><th>Zawodnik</th>${o.map((_, i) => `<th class="c">${i + 1}</th>`).join('')}<th class="c">Wyg.</th><th class="c">Pkt</th><th class="c">Miejsce</th></tr></thead><tbody>
  ${o.map((id, i) => { const e = ent(id), s = sx[id]; return `<tr><td class="muted">${i + 1}</td><td><span class="club-dot" style="--c:${club(e.club).c}"></span> <b>${esc(e.name)}</b><br><small class="muted">${esc(club(e.club).name)}</small></td>${o.map(y => cell(id, y)).join('')}<td class="c">${s.w}</td><td class="c"><b>${s.pts}</b></td><td class="c">${done ? (s.place <= 3 ? medalDot(s.place) : s.place) : '–'}</td></tr>`; }).join('')}
  </tbody></table></div>
  <div class="sub-h">Walki</div>${P.map((p, k) => { const r = c.res[`rr-${k}`], no = noOf(c, `rr-${k}`); return `<div class="feed-i"><span class="tm">${no || ''}</span><span>${nm(p[0])} vs ${nm(p[1])}${r ? ` — <b>${esc(ent(r.w === 'a' ? p[0] : p[1]).name)}</b> (${esc(r.m)})` : ''}</span></div>`; }).join('')}</section>`;
}
const scoreChips = s => { const [a, b] = dropIdx(s); return s.map((v, i) => `<span class="sc-chip ${i === a || i === b ? 'x' : ''}">${fmt1(v)}</span>`).join(''); };
function kataHTML(c) {
  const two = kataTwo(c), fin = catPlaces(c).done, liveKey = S.mats[c.tatami].active;

    const ranked = rows.filter(x => x.res).sort((a, b) => b.res.tot - a.res.tot || sum4(b.res.s) - sum4(a.res.s)), pend = rows.filter(x => !x.res);

     ${ranked.map((x, i) => { const e = ent(x.id); return `<tr class="${cut && i === c.adv - 1 ? 'cut' : ''}"><td>${!cut && fin && i < 3 ? medalDot(i + 1) : i + 1}</td><td><b>${esc(e.name)}</b><br><small class="muted">${esc(club(e.club).name)}</small></td><td><div class="chips">${scoreChips(x.res.s)}</div></td><td class="tot">${fmt1(x.res.tot)}</td></tr>`; }).join('')}

function seChecks(c) {
  const sl = c.br.slots, size = sl.length, R = Math.log2(size), by = {};
  sl.forEach((id, s) => { if (id && id !== 'BYE') { const k = ent(id).club; (by[k] = by[k] || []).push(s); } });
  const clubs = Object.entries(by).filter(([, v]) => v.length > 1).map(([k, v]) => { let mn = 99; for (let i = 0; i < v.length; i++) for (let j = i + 1; j < v.length; j++) mn = Math.min(mn, meetR(v[i], v[j])); return { k, n: v.length, meet: mn, ideal: R - Math.ceil(Math.log2(v.length)) }; });
  const recv = [], fight = []; let empty = 0;
  for (let p = 0; p < size / 2; p++) { const a = sl[2 * p], b = sl[2 * p + 1]; if (a === 'BYE' && b === 'BYE') empty++; else if (a === 'BYE' || b === 'BYE') recv.push(a === 'BYE' ? b : a); else fight.push(a, b); }
  const minR = recv.length ? Math.min(...recv.map(id => ent(id).g)) : 99, maxF = fight.length ? Math.max(...fight.map(id => ent(id).g)) : 0;
  return { R, clubs, recv, byeOk: !recv.length || minR >= maxF, empty };
}

function vRefMat(t) {

function qList(t, q, live) {

  const done = q.filter(i => i.status === 'done'), hidden = ui.qAll ? [] : done.slice(0, Math.max(0, done.length - 2));

    let right;
    if (i.status === 'done') right = `<span class="q-res">${i.kind === 'kata' ? fmt1(i.res.tot) : esc(MSHORT[i.res.m] || i.res.m)}${m.last === i.key && !live && !ui.edit ? ` · <button class="lnk" data-act="editRes" data-key="${i.key}">popraw</button>` : ''}</span>`;
    else if (i.status === 'live') right = '<span class="pill live"><span class="dot"></span>trwa</span>';
    else if (i.status === 'ready') right = live || ui.edit ? '<span class="pill">gotowa</span>' : `<button class="btn sm ${i === firstReady ? 'primary' : ''}" data-act="activate" data-key="${i.key}">Aktywuj</button>`;
    else right = '<span class="pill">czeka</span>';

    const names = i.kind === 'kata' ? nm(i.a, 'awans z rundy 1') : `${w === 'a' ? `<span class="w">${nm(i.a)}</span>` : nm(i.a)} <span class="muted">vs</span> ${w === 'b' ? `<span class="w">${nm(i.b)}</span>` : nm(i.b)}`;
    return `<li class="q-i s-${i.status} ${i === firstReady ? 'next' : ''}" data-key="${i.key}" ${i.status === 'live' ? 'id="qLive"' : ''}><span class="no">${i.code}</span><div><b>${names}</b><small>${esc(catShort(cat(i.cat)))} · ${esc(i.label)}</small></div>${right}</li>`;
  }).join('') || '<li class="muted">Brak walk — organizator nie zatwierdził jeszcze drabinek dla tego tatami.</li>'}</ol>`;

function panel(t, it, d, editing) {

  const head = `<div class="match-h"><div><div class="eyebrow">${editing ? 'Poprawka wyniku' : '● Trwa'} · ${TYPES[c.type]} · ${esc(catShort(c))}</div><h2>Walka ${it.code} <span>${esc(it.label)}</span></h2>${prev ? `<div class="lock-note">Wynik walki ${prev.code} jest już zablokowany — rozpoczęto kolejną walkę. ${rq('REQ-REF-07')}</div>` : ''}</div>${editing ? '<button class="btn sm" data-act="cancelEdit">Anuluj poprawkę</button>' : '<button class="btn sm" data-act="deact">Cofnij aktywację</button>'}</div>`;
  if (it.kind === 'kata') return head + kataPanel(it, editing);

}

function teamPanel(it, d, editing) {

function decideHTML(it, d, editing, methods) {

const parseSc = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; };
const kataValid = d => d.every(v => { const n = parseSc(v); return n != null && n >= 5 && n <= 10; });
function kataCalcHTML(d) {
  if (!kataValid(d)) return '<span class="muted">Wpisz 4 oceny (5,0–10,0) — suma policzy się sama.</span>';
  const s = d.map(v => Math.round(parseSc(v) * 10) / 10);
  return `${scoreChips(s)}<span class="tot"><small>SUMA DWÓCH ŚRODKOWYCH</small>${fmt1(kataTot(s))}</span>`;
}
function kataPanel(it, editing) {

function updKata(key) {

function autoWin(d) {
  if (d.ip[0] || d.wa[0] >= 2) { d.w = 'a'; d.m = 'Ippon'; d.auto = true; return; }
  if (d.ip[1] || d.wa[1] >= 2) { d.w = 'b'; d.m = 'Ippon'; d.auto = true; return; }
  if (d.pen[0] >= 4) { d.w = 'b'; d.m = 'Hansoku'; d.auto = true; return; }
  if (d.pen[1] >= 4) { d.w = 'a'; d.m = 'Hansoku'; d.auto = true; return; }
  if (d.auto) { d.w = null; d.m = null; d.auto = false; }
}
function advMsg(it, w) {
  const c = cat(it.cat), name = ent(w).name;
  if (catPlaces(c).done) return `${c.br.sys === 'kata' ? '' : `${name} wygrywa. `}Kategoria zakończona — medale w klasyfikacji`;
  if (c.br.sys !== 'se') return `${name} wygrywa — tabela zaktualizowana`;
  if (it.id === 'b3') return `${name} zdobywa brąz`;
  const r = +it.id.slice(1).split('-')[0], R = Math.log2(c.br.slots.length);
  return r >= R - 1 ? `${name} wygrywa kategorię` : `${name} przechodzi do rundy: ${roundName(r + 1, R, c).toLowerCase()}`;
}
function saveEdit(t, it, res) {
  const c = cat(it.cat), old = c.res[it.id];

  if (!catPlaces(c).done) c.doneAt = null;
  ui.edit = null; delete ui.kd[it.key];
  commit(); toast(`Wynik walki ${it.code} poprawiony — drabinka przeliczona`);
}

function printDoc(T, title, body, landscape) {
  $('#print').innerHTML = `<style>@page{size:A4 ${landscape ? 'landscape' : 'portrait'};margin:10mm}</style><div class="pr-h"><b>${esc(T ? T.name : 'Turniej')}</b><span>${T ? `${fmtDate(T.date)} · ${esc(T.place)}` : ''}</span><span>wydruk ${new Date().toLocaleString('pl-PL')}</span></div><h1>${esc(title)}</h1>${body}`;
  setTimeout(() => window.print(), 60);
}
function printCat(c) {
  let body;
  if (!c.br || c.br.status !== 'approved') body = '<p>Drabinka nie jest jeszcze zatwierdzona.</p>';
  else if (c.br.sys === 'se') { const T = seTree(c), W = T.R * BX.COLW + (T.R - 1) * BX.GAP + 44, H = BX.TOP + T.size / 2 * BX.U + (T.b3 ? 112 : 0) + 44, z = Math.min(1, 1000 / W, 600 / H); body = podiumHTML(c) + `<div style="zoom:${z.toFixed(3)}">${treeHTML(c, 'print', T)}</div>`; }
  else body = podiumHTML(c) + (c.br.sys === 'rr' ? rrHTML(c) : kataHTML(c));
  return `<section class="pr-page"><h2>${esc(catName(c))}</h2><p class="pr-meta">Tatami ${TL(c.tatami)} · ${sysLabel(c)} · ${entCount(c)} · ${esc(criteria(c))}</p>${body}</section>`;
}
function printSched(T) {
  const sch = schedule(T), live = T === pubT();
  return TABS.map(t => `<section class="pr-tat"><h2>Tatami ${TL(t)}</h2><table class="t"><thead><tr><th>Godz.</th><th>Kategoria</th><th>Walk</th><th>Status</th></tr></thead><tbody>${sch[t].map(r => `<tr><td>${fmtMin(r.start)}–${fmtMin(r.end)}</td><td>${esc(catName(r.c))}</td><td>${r.n}</td><td>${catState(r.c)[0]}</td></tr>`).join('')}</tbody></table>
   ${live && Q(t).length ? `<table class="t" style="margin-top:8px"><thead><tr><th>Nr</th><th>Kategoria · runda</th><th>Aka / zawodnik</th><th>Shiro</th><th>Wynik</th></tr></thead><tbody>${Q(t).map(i => `<tr><td>${i.code}</td><td>${esc(catShort(cat(i.cat)))} · ${esc(i.label)}</td><td>${i.a ? esc(ent(i.a).name) : '—'}</td><td>${i.kind === 'kata' ? '' : i.b ? esc(ent(i.b).name) : '—'}</td><td>${i.res ? (i.kind === 'kata' ? fmt1(i.res.tot) + ' pkt' : esc(ent(i.res.w === 'a' ? i.a : i.b).name) + ' · ' + esc(i.res.m)) : ''}</td></tr>`).join('')}</tbody></table>` : ''}</section>`).join('');

  athEdit: el => { const a = S.ath[el.dataset.id]; if (!a || a.club !== ui.user.club) return; ui.af = { ...a }; openDrawer('Edytuj zawodnika', athFormHTML()); },
  athSave: () => {
    const f = ui.af, err = m => { $('#afErr').textContent = m; }, w = parseFloat(String(f.w).replace(',', '.'));
    if (!f.fn.trim() || !f.ln.trim()) return err('Podaj imię i nazwisko.');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(f.dob) || f.dob > todayISO() || ageAt(f.dob, todayISO()) > 90) return err('Podaj poprawną datę urodzenia.');
    if (!(w >= 15 && w <= 150)) return err('Podaj wagę 15–150 kg.');
    const data = { fn: f.fn.trim(), ln: f.ln.trim(), dob: f.dob, sex: f.sex, g: +f.g, w: Math.round(w * 10) / 10 };
    if (f.id) Object.assign(S.ath[f.id], data); else { const id = 'a' + Date.now().toString(36); S.ath[id] = { id, club: ui.user.club, ...data }; }
    closeDrawer(); commit(); toast(f.id ? 'Zapisano zmiany' : `Dodano: ${data.fn} ${data.ln}`);
  },
  athDel: el => {
    const id = el.dataset.id, a = S.ath[id]; if (!a || a.club !== ui.user.club) return;
    if (S.cats.some(c => c.br?.status === 'approved' && c.entries.includes(id)) || Object.values(S.teams).some(t => t.members.includes(id))) return toast('Nie można usunąć — zawodnik startuje w zatwierdzonej drabince lub w drużynie.');
    const n = S.cats.filter(c => c.entries.includes(id)).length;
    ask(`Usunąć <b>${esc(a.fn)} ${esc(a.ln)}</b> z bazy klubu?${n ? ` Zostanie wycofany z ${pl(n, 'kategorii', 'kategorii', 'kategorii')}.` : ''}`, 'Usuń', () => {
      S.cats.forEach(c => { if (c.entries.includes(id)) { c.entries = c.entries.filter(x => x !== id); if (c.br) { c.br = null; c.res = {}; } } });
      delete S.ath[id]; commit(); toast('Zawodnik usunięty');
    });
  },
  reg: el => {
    const c = cat(el.dataset.c), id = el.dataset.a;
    if (tour(c.t).status !== 'open' || c.br) return toast('Zgłoszenia do tej kategorii są zamknięte');
    const on = c.entries.includes(id);
    c.entries = on ? c.entries.filter(x => x !== id) : [...c.entries, id];
    commit(); toast(on ? `Wycofano: ${ent(id).name}` : `Zgłoszono: ${ent(id).name} → ${catShort(c)}`);
  },
  /* sędzia */
  pickT: el => { const t = +el.dataset.t; TABS.forEach(x => { if (S.mats[x].ref?.tab === TAB) S.mats[x].ref = null; }); S.mats[t].ref = { tab: TAB, at: Date.now() }; ui.refT = t; saveUser(); commit({ quiet: true }); location.hash = `#/referee/tatami/${TL(t)}`; },
  activate: el => {
    const t = ui.refT, m = S.mats[t];
    if (m.active) return toast('Najpierw zatwierdź trwającą walkę');
    if (ui.edit) return toast('Najpierw zapisz albo anuluj poprawkę wyniku');
    const it = Q(t).find(i => i.key === el.dataset.key); if (!it || it.status !== 'ready') return;
    const locked = m.last ? Q(t).find(i => i.key === m.last) : null;
    activate(t, it.key); commit(); toast(`Walka ${it.code} aktywna${locked ? ` · wynik walki ${locked.code} zablokowany` : ''}`); window.scrollTo(0, 0);
  },
  deact: () => { const m = S.mats[ui.refT]; if (!m.active) return; ask('Cofnąć aktywację? Wpisane punkty tej walki zostaną wyczyszczone, a walka wróci do kolejki.', 'Cofnij aktywację', () => { m.active = null; m.live = null; m.last = m.prev; m.prev = null; commit(); toast('Walka wróciła do kolejki'); }); },
  sc: el => {
    const d = curDraft(); if (!d) return;
    const i = el.dataset.s === 'a' ? 0 : 1, k = el.dataset.k;
    if (k === 'undo') { for (let j = d.hist.length - 1; j >= 0; j--) if (d.hist[j].i === i) { const x = d.hist.splice(j, 1)[0]; d[x.k][i] = Math.max(0, d[x.k][i] - 1); break; } }
    else if ((k === 'wa' && d.wa[i] < 2) || (k === 'ip' && d.ip[i] < 1) || (k === 'pen' && d.pen[i] < 4)) { d[k][i]++; d.hist.push({ i, k }); }
    autoWin(d); saveDraft();
  },
  win: el => {
    const d = curDraft(), it = curItem(); if (!d || !it) return;
    d.w = el.dataset.s; d.auto = false;
    const i = d.w === 'a' ? 0 : 1, sa = d.sub.filter(x => x === 'a').length, sb = d.sub.filter(x => x === 'b').length;
    if (it.kind === 'team') d.m = (d.w === 'a' ? `${sa}:${sb}` : `${sb}:${sa}`) + (sa === sb ? ' · dogrywka' : '');
    else if (!d.m || (d.m === 'Ippon' && !d.ip[i] && d.wa[i] < 2)) d.m = d.wa[i] > d.wa[1 - i] ? 'Waza-ari' : 'Hantei';
    saveDraft();
  },
  method: el => { const d = curDraft(); if (!d) return; d.m = el.dataset.v; d.auto = false; saveDraft(); },
  sub: el => {
    const d = curDraft(); if (!d) return;
    const i = +el.dataset.i; d.sub[i] = d.sub[i] === el.dataset.v ? null : el.dataset.v;
    const wa = d.sub.filter(x => x === 'a').length, wb = d.sub.filter(x => x === 'b').length;
    if (wa >= 2 || wb >= 2) { d.w = wa >= 2 ? 'a' : 'b'; d.m = `${Math.max(wa, wb)}:${Math.min(wa, wb)}`; d.auto = true; }
    else if (d.auto) { d.w = null; d.m = null; d.auto = false; }
    saveDraft();
  },
  confirm: () => {
    const t = ui.refT, it = curItem(), d = curDraft(); if (!it || !d || !d.w || !d.m) return;
    const res = { w: d.w, m: d.m, wa: d.wa.slice(), pen: d.pen.slice(), ip: d.ip.slice(), ...(it.kind === 'team' ? { sub: d.sub.slice() } : {}) };
    if (ui.edit) return saveEdit(t, it, res);
    applyResult(t, it, res); commit(); toast(`Walka ${it.code}: ${advMsg(it, d.w === 'a' ? it.a : it.b)}`);
  },
  confirmKata: () => {
    const t = ui.refT, it = curItem(); if (!it) return;
    const d = ui.kd[it.key]; if (!d || !kataValid(d)) return;
    const s = d.map(v => Math.round(parseSc(v) * 10) / 10), res = { s, tot: kataTot(s) };
    if (ui.edit) return saveEdit(t, it, res);
    applyResult(t, it, res); delete ui.kd[it.key]; commit(); toast(`${ent(it.a).name}: ${fmt1(res.tot)} pkt${catPlaces(cat(it.cat)).done ? ' · kategoria zakończona' : ''}`);
  },
  editRes: el => {
    const t = ui.refT, m = S.mats[t], key = el.dataset.key;
    if (m.active || m.last !== key) return toast('Poprawka zablokowana — rozpoczęto kolejną walkę (REQ-REF-07)');
    const it = Q(t).find(i => i.key === key), r = it.res;
    if (it.kind === 'kata') ui.kd[key] = r.s.map(fmt1);
    ui.edit = { t, key, d: { wa: (r.wa || [0, 0]).slice(), ip: (r.ip || [0, 0]).slice(), pen: (r.pen || [0, 0]).slice(), w: r.w || null, m: r.m || null, auto: false, sub: (r.sub || [null, null, null]).slice(), hist: [] } };
    render(true); window.scrollTo(0, 0);
  },
  qAll: () => { ui.qAll = !ui.qAll; ui.scrolledLive = null; render(true); },
  cancelEdit: () => { if (ui.edit) delete ui.kd[ui.edit.key]; ui.edit = null; render(true); },
};
function shiftCat(id, dir) {
  const c = cat(id), list = S.cats.filter(x => x.t === c.t && x.tatami === c.tatami).sort((a, b) => a.ord - b.ord), i = list.indexOf(c), o = list[i + dir];
  if (!o || catBusy(c) || catBusy(o)) return;
  [c.ord, o.ord] = [o.ord, c.ord]; commit();
}
const IN = {
  fq: el => { ui.fq = el.value; $('#findRes').innerHTML = findHTML(); },
  pf: el => { ui.pf[el.dataset.k] = el.value; $('#peopleList').innerHTML = peopleList(); },
  addQ: el => { ui.addQ = el.value; const c = cat(el.dataset.c); $('#addList').innerHTML = addList(c, c.br?.status === 'approved'); },
  tf: el => { ui.tf[el.dataset.k] = el.value; },
  cf: el => { ui.cf[el.dataset.k] = el.value; const n = $('#cfName'); if (n) n.textContent = catName(cfCat(ui.cf)); },
  af: el => { ui.af[el.dataset.k] = el.value; },
  ks: el => { const key = el.dataset.key; (ui.kd[key] = ui.kd[key] || ['', '', '', ''])[+el.dataset.i] = el.value; updKata(key); },
};
const CH = {
  pf: el => { ui.pf[el.dataset.k] = el.value; $('#peopleList').innerHTML = peopleList(); },
  go: el => { location.hash = el.dataset.base + el.value; },
  at: el => { ui.at = el.value; render(true); },
  ct: el => { ui.ct = el.value; render(true); },
  addOnly: el => { ui.addOnly = el.checked; render(true); },
  cf: el => { ui.cf[el.dataset.k] = el.value; $('#dwBody').innerHTML = catFormHTML(); },
  af: el => { ui.af[el.dataset.k] = el.value; },
  catMove: el => { const c = cat(el.dataset.id); if (catBusy(c)) return; moveCat(c, +el.value); commit(); toast(`${catShort(c)} → Tatami ${TL(c.tatami)}`); },
};

/* ===================== render ===================== */
const route = () => location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
const zoneOf = r => r[0] === 'admin' ? 'admin' : r[0] === 'referee' ? 'referee' : 'pub';
const TABBAR = [
  ['#/', 'Moi', '<path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/>'],
  ['#/live', 'Na żywo', '<circle cx="12" cy="12" r="2.4"/><path d="M8 8a5.7 5.7 0 0 0 0 8M16 8a5.7 5.7 0 0 1 0 8M5.2 5.2a9.6 9.6 0 0 0 0 13.6M18.8 5.2a9.6 9.6 0 0 1 0 13.6"/>'],
  ['#/drabinki', 'Drabinki', '<path d="M3 5h6v4H3zM3 15h6v4H3zM9 7h3v10H9M12 12h3M15 10h6v4h-6z"/>'],
  ['#/uczestnicy', 'Lista', '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c.6-3.4 3-5.4 6-5.4s5.4 2 6 5.4"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.7c2.6.2 4.4 2 5 5"/>'],
  ['#/klasyfikacja', 'Medale', '<circle cx="12" cy="15" r="5"/><path d="M8.5 3.5h7L13.5 10h-3z"/>'],
];
const ZONES = [['pub', '#/', 'Publiczna', '/'], ['admin', '#/admin', 'Panel', '/admin'], ['referee', '#/referee', 'Sędzia', '/referee']];
function canon(r) {
  const role = ui.user?.role;
  if (r[0] === 'admin' && role === 'club' && r[1] !== 'klub') return ['admin', 'klub', 'na-zywo'];
  if (r[0] === 'admin' && role === 'admin' && (!r[1] || r[1] === 'klub')) return ['admin', 'turnieje'];
  return r;
}
function renderTop(r) {
  const z = zoneOf(r), p = '#/' + r.join('/'), role = ui.user?.role;
  $('#zones').innerHTML = ZONES.map(([k, h, l, s]) => `<a href="${h}" class="${k === z ? 'on' : ''}">${l}<small>${s}</small></a>`).join('');
  let links = [];
  if (z === 'pub') links = [['#/', 'Start'], ['#/live', 'Na żywo'], ['#/uczestnicy', 'Uczestnicy'], ['#/drabinki', 'Drabinki'], ['#/klasyfikacja', 'Klasyfikacja drużynowa'], ['#/specyfikacja', 'Pokrycie specyfikacji']];
  else if (z === 'admin' && role === 'admin') links = [['#/admin/turnieje', 'Turnieje'], ['#/admin/kategorie', 'Kategorie'], ['#/admin/drabinki', 'Drabinki'], ['#/admin/harmonogram', 'Harmonogram'], ['#/admin/klasyfikacja', 'Klasyfikacja drużynowa']];
  else if (z === 'admin' && role === 'club') links = [['#/admin/klub/na-zywo', 'Na żywo'], ['#/admin/klub/zawodnicy', 'Moi zawodnicy'], ['#/admin/klub/zgloszenia', 'Zgłoszenia']];
  else if (z === 'referee' && role === 'ref') links = [['#/referee', 'Wybór tatami'], ...TABS.map(t => [`#/referee/tatami/${TL(t)}`, `Tatami ${TL(t)}`])];
  const on = h => h === '#/' ? p === '#/' : p === h || (p.startsWith(h + '/') && h.split('/').length > 2);
  $('#subnav').innerHTML = links.map(([h, l]) => `<a href="${h}" class="${on(h) ? 'on' : ''}">${l}</a>`).join('');
  const u = ui.user;
  $('#userBox').innerHTML = u ? `<span class="user-chip"><span class="avatar ${u.role === 'club' ? 'club' : u.role === 'ref' ? 'ref' : ''}" ${u.role === 'club' ? `style="--c:${club(u.club).c}"` : ''}>${esc(u.ini)}</span><span><b>${esc(u.name)}</b><small>${esc(u.sub)}</small></span><button data-act="logout">Wyloguj</button></span>` : '<a class="chipbtn" href="#/admin" style="text-decoration:none">Zaloguj</a>';
  $('#reqBtn').setAttribute('aria-pressed', String(ui.reqs)); $('#simBtn').setAttribute('aria-pressed', String(ui.sim));
  document.body.classList.toggle('reqs', ui.reqs);
  document.body.classList.toggle('z-pub', z === 'pub');
  const tOn = h => h === '#/' ? p === '#/' : p === h || p.startsWith(h + '/');
  $('#tabbar').innerHTML = z === 'pub' ? TABBAR.map(([h, l, d]) => `<a href="${h}" class="${tOn(h) ? 'on' : ''}" ${tOn(h) ? 'aria-current="page"' : ''}><svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg><span>${l}${h === '#/' && FAV.length ? ` (${FAV.length})` : ''}</span></a>`).join('') : '';
}
function view(r) {
  switch (r[0]) {
    case undefined: return vHome();
    case 'live': return vLive();
    case 'uczestnicy': return vPeople();
    case 'drabinki': return vBrackets(r[1]);
    case 'klasyfikacja': return vTeam();
    case 'specyfikacja': return vSpec();
    case 'admin': return adminView(r.slice(1));
    case 'referee': return refView(r.slice(1));
  }
  return '<div class="gate"><h2>Nie ma takiej strony</h2><a class="btn" href="#/">Strona główna</a></div>';
}
const footHTML = () => `<footer class="foot"><span>Mock wg specyfikacji wymagań (REQ). Dane przykładowe; stan zapisuje się w tej przeglądarce i synchronizuje między kartami.</span><span><a href="#/specyfikacja">Pokrycie specyfikacji</a> · <button class="lnk" data-act="sim">Symulacja: ${ui.sim ? 'wł.' : 'wył.'}</button> · <button class="lnk" data-act="reqs">Numery REQ: ${ui.reqs ? 'wł.' : 'wył.'}</button> · <button class="lnk" data-act="reset">Resetuj dane demo</button></span></footer>`;
function claimIfRef(r) {
  if (ui.user?.role !== 'ref' || r[0] !== 'referee' || r[1] !== 'tatami') return;
  const t = tParse(r[2]); if (!t) return;
  ui.refT = t;
  const c = S.mats[t].ref;
  if (!c || c.tab !== TAB || Date.now() - c.at > 8000) {
    TABS.forEach(x => { if (x !== t && S.mats[x].ref?.tab === TAB) S.mats[x].ref = null; });
    S.mats[t].ref = { tab: TAB, at: Date.now() }; saveUser();
    setTimeout(() => commit({ quiet: true }), 0);
  }
}
let pendingRender = false;
const editing = () => { const a = document.activeElement; return !!a && a.matches('input:not([type=checkbox]),textarea') && $('#app').contains(a); };
function render(force) {
  if (!force && editing()) { pendingRender = true; return; }
  pendingRender = false; qCache = null;
  let r = route();
  const c = canon(r);
  if (c.join('/') !== r.join('/')) { history.replaceState(null, '', '#/' + c.join('/')); r = c; }
  claimIfRef(r);
  renderTop(r);
  $('#app').innerHTML = view(r) + footHTML();
  if (r[0] === 'referee') {
    const el = $('#qLive') || $('.q-i.next'), box = $('.qlist');
    if (el && box && ui.scrolledLive !== el.dataset.key) { ui.scrolledLive = el.dataset.key; box.scrollTop = Math.max(0, el.offsetTop - 60); }
  }
  fitTrees();
}
/* drabinka bez przewijania w bok: zmniejszamy ją do szerokości kolumny (do 60%) */
function fitTrees() { document.querySelectorAll('#app .bk[data-w]').forEach(bk => { const z = bk.parentElement.clientWidth / (+bk.dataset.w + 44); bk.style.zoom = z < 1 && z >= .6 ? z.toFixed(3) : ''; }); }
let fitT; window.addEventListener('resize', () => { clearTimeout(fitT); fitT = setTimeout(fitTrees, 120); });

/* ===================== start ===================== */
S = load();
/* zapisany turniej, który już się skończył, nie ma czego pokazać — startujemy od nowa */
if (S && TABS.every(t => !S.mats[t].active && Q(t).every(i => i.res))) S = null;
if (!S) { seed(); save(); }
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(el, e);
});
document.addEventListener('input', e => { const el = e.target.closest('[data-in]'); if (el && IN[el.dataset.in]) IN[el.dataset.in](el); });
document.addEventListener('change', e => { const el = e.target.closest('[data-ch]'); if (el && CH[el.dataset.ch]) CH[el.dataset.ch](el); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#modal').hidden) { $('#modal').hidden = true; mdFn = null; } else closeDrawer(); }
  if (e.key === 'Enter' && e.target.matches('[data-in="ks"]')) { e.preventDefault(); const nx = $('#ks' + (+e.target.dataset.i + 1)); if (nx) nx.focus(); else { const ok = $('#kataOk'); if (ok && !ok.disabled) ok.click(); } }
});
document.addEventListener('focusout', () => setTimeout(() => { if (pendingRender && !editing()) render(false); }, 60));
window.addEventListener('hashchange', () => { ui.swap = null; ui.edit = null; closeDrawer(); render(true); window.scrollTo(0, 0); });
render(true);
setInterval(simTick, 1000);
setInterval(() => claimIfRef(route()), 5000);
</script>
