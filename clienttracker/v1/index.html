<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2e3230">
<title>ClientTracker · zegar kontrolny zgłoszeń</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='5' y='2' width='22' height='28' rx='1.5' fill='%23f4ecd6' stroke='%232d6a5a' stroke-width='1.6'/><circle cx='16' cy='6.5' r='1.6' fill='%232d6a5a'/><path d='M9 12h14M9 17h14M9 22h14' stroke='%232d6a5a' stroke-width='1.2'/><path d='M10 14.6h5M17 19.6h5' stroke='%23c3161c' stroke-width='2.2'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=Doto:wght@500..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>try { const t = JSON.parse(localStorage.getItem('ct1-theme')); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>

<a class="skip" href="#app">Przejdź do treści</a>

<div class="demo">
  <div class="wrap demo__in">
    <span class="demo__badge">Makieta v1</span>
    <span class="demo__note">Dane fikcyjne, „serwer” w przeglądarce.</span>
    <form class="demo__clock" id="clockForm">
      <label for="clockInput" title="TimeProvider: cała aplikacja bierze czas z tego zegara">Zegar makiety</label>
      <input type="datetime-local" id="clockInput" step="60">
      <button type="submit">Ustaw</button>
      <button type="button" data-act="clock-live">Na żywo</button>
    </form>
    <button type="button" class="demo__cmd" data-act="reset-demo" title="Usuwa klientów, zgłoszenia, wpisy i Ustawienia, wgrywa dane demo. Sesji nie rusza.">reset-demo</button>
    <button type="button" class="demo__theme" data-act="theme"><span class="demo__theme-sw" aria-hidden="true"></span><span id="themeLabel">Motyw</span></button>
  </div>
</div>

<div id="root"></div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<dialog class="dlg" id="dlg" aria-labelledby="dlgTitle"></dialog>

<script src="sla.js"></script>
<script src="data.js"></script>
<script src="model.js"></script>
<script src="app.js"></script>
</body>
</html>
